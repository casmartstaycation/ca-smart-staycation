<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Settings | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:650px;margin:40px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center;margin:0}.subtitle{text-align:center;color:#666;margin-bottom:25px}.card{border:1px solid #ddd;border-radius:10px;padding:20px;margin:16px 0}.card h2{margin-top:0;color:#0b5d4d;font-size:19px}label{display:block;font-weight:bold;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5d1;border-radius:7px;font:inherit}button{width:100%;margin-top:15px;padding:12px;border:0;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:15px}.secondary{background:#c9a44c}.danger{background:#777}.message{display:none;padding:12px;border-radius:7px;margin:15px 0}.message.show{display:block}.success{background:#e9f3ee;color:#0b5d4d}.error{background:#fff0ef;color:#b42318}.hint{font-size:13px;color:#68736e;line-height:1.5}.current{background:#f7faf9;padding:12px;border-radius:7px;margin-top:10px;word-break:break-word}</style></head><body><div class="container"><h1>Account Settings</h1><p class="subtitle">CA Smart Staycation Guest Account</p><div id="message" class="message"></div><div class="card"><h2>Registered Email</h2><p class="hint">Changing your email updates the email associated with your guest account and bookings.</p><div id="currentEmail" class="current">Loading...</div><form id="emailForm"><label for="newEmail">New Email Address</label><input id="newEmail" type="email" required autocomplete="email"><label for="emailPassword">Current Password</label><input id="emailPassword" type="password" required autocomplete="current-password"><button type="submit">Update Email</button></form></div><div class="card"><h2>Change Password</h2><p class="hint">Use at least 8 characters. Your current password is required before changing it.</p><form id="passwordForm"><label for="currentPassword">Current Password</label><input id="currentPassword" type="password" required autocomplete="current-password"><label for="newPassword">New Password</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"><label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Change Password</button></form></div><button class="secondary" id="back">Back to Guest Account</button><button class="danger" id="logout">Logout</button></div><script>const API=window.location.hostname.endsWith("github.io")?"https://ca-smart-staycation-muqd.onrender.com/api":(window.CA_SMART_API||"/api"),tokenKey="guestAuthToken";const auth=()=>({Authorization:`Bearer ${localStorage.getItem(tokenKey)}`,"Content-Type":"application/json"});const msg=document.getElementById("message");function show(text,ok=false){msg.textContent=text;msg.className=`message show ${ok?"success":"error"}`;}async function load(){const t=localStorage.getItem(tokenKey);if(!t){location.href="guest-login.html";return}try{const r=await fetch(`${API}/guest-auth/me`,{headers:{Authorization:`Bearer ${t}`},cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||"Session expired.");document.getElementById("currentEmail").textContent=d.account.email;document.getElementById("newEmail").value=d.account.email}catch(e){show(e.message)}}document.getElementById("emailForm").onsubmit=async e=>{e.preventDefault();try{const r=await fetch(`${API}/guest-auth/account/email`,{method:"PUT",headers:auth(),body:JSON.stringify({email:document.getElementById("newEmail").value.trim(),password:document.getElementById("emailPassword").value})}),d=await r.json();if(!r.ok)throw Error(d.message);show("Email updated successfully. Your bookings remain linked to your account.",true);document.getElementById("currentEmail").textContent=d.account.email;document.getElementById("emailPassword").value="";localStorage.setItem("guestAccount",JSON.stringify(d.account))}catch(e){show(e.message)}};document.getElementById("passwordForm").onsubmit=async e=>{e.preventDefault();const a=document.getElementById("newPassword").value,b=document.getElementById("confirmPassword").value;if(a!==b)return show("New password and confirmation do not match.");try{const r=await fetch(`${API}/guest-auth/account/password`,{method:"PUT",headers:auth(),body:JSON.stringify({currentPassword:document.getElementById("currentPassword").value,newPassword:a})}),d=await r.json();if(!r.ok)throw Error(d.message);show("Password changed successfully.",true);document.getElementById("passwordForm").reset()}catch(e){show(e.message)}};document.getElementById("back").onclick=()=>location.href="guest-dashboard.html";document.getElementById("logout").onclick=()=>{localStorage.removeItem(tokenKey);localStorage.removeItem("guestAccount");localStorage.removeItem("guestBooking");location.href="guest-login.html"};load();</script></body></html>
