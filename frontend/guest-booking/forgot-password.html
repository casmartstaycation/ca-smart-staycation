<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password | CA Smart Staycation</title>
<!-- Use absolute asset paths so the page loads correctly from /guest-booking/ -->
<link rel="stylesheet" href="/css/style.css">
<!-- Minimal inline fallback to ensure form is visible if main stylesheet fails -->
<style id="forgot-fallback">
  /* Minimal fallback for forgot-password layout */
  html,body{height:100%;}
  body.forgot-page{background:#f5f7fb;margin:0;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;color:#222}
  .forgot-header{padding:18px 16px;background:transparent}
  .forgot-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .forgot-main{display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;min-height:calc(100vh - 160px)}
  .forgot-card{box-sizing:border-box;max-width:480px;width:100%;margin:24px auto;padding:24px;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(20,20,20,0.06)}
  .forgot-eyebrow{font-size:12px;color:#6b7280;margin:0 0 8px}
  .forgot-card h1{margin:0 0 8px;font-size:20px}
  .forgot-intro{margin:0 0 16px;color:#475569}
  .form-group{margin-bottom:12px}
  label{display:block;margin-bottom:6px;font-weight:600}
  input[type="email"],input[type="text"],input[type="password"],button{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #d6dbe6;font-size:15px}
  button.continue-button{background:#007bff;color:#fff;border:none;cursor:pointer;padding:10px 12px}
  .forgot-divider{height:1px;background:#eef2f7;margin:16px 0}
  .back-login{display:inline-block;color:#334155;text-decoration:none}
  .forgot-footer{text-align:center;padding:18px;color:#94a3b8;font-size:13px}
  @media (min-width:768px){.forgot-main{padding-top:48px}.forgot-card{margin-top:48px}}
</style>
</head>
<body class="forgot-page">
<header class="forgot-header">
    <a class="forgot-brand" href="/" aria-label="CA Smart Staycation home">
        <span class="forgot-brand-mark">CA</span>
        <span><strong>CA Smart Staycation</strong><small>PRIVATE • ELEGANT • COMFORT</small></span>
    </a>
</header>
<main class="forgot-main">
    <section class="forgot-card" aria-labelledby="forgotTitle">
        <p class="forgot-eyebrow">GUEST ACCOUNT</p>
        <h1 id="forgotTitle">Forgot Password?</h1>
        <p class="forgot-intro">Enter the email address you used for your CA Smart Staycation booking. If an account exists, we'll send instructions to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
            </div>
            <button type="submit" class="continue-button" id="resetButton">Send Reset Link <span>→</span></button>
        </form>
        <p id="message" class="forgot-message" role="status"></p>
        <div class="forgot-divider"></div>
        <a class="back-login" href="guest-login.html">← Back to Guest Login</a>
    </section>
</main>
<footer class="forgot-footer">© 2026 CA Smart Staycation. All rights reserved.</footer>
<script src="/js/forgot-password.js"></script>
</body>
</html>
