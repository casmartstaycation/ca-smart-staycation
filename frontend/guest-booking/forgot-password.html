<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot Password | CA Smart Staycation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="booking-container"><div class="form-card">
<h2>Forgot Password</h2>
<p>Enter the email address used for your CA Smart Staycation booking. If an account exists, we will send instructions to reset your password.</p>
<form id="forgotPasswordForm">
<div class="form-group"><label>Email Address</label><input type="email" id="email" autocomplete="email" required></div>
<button type="submit" class="continue-button" id="resetButton">Send Reset Link</button>
</form>
<p id="message" style="margin-top:16px;line-height:1.5;"></p>
<div style="text-align:center;margin-top:18px;"><a href="guest-login.html" style="color:#0b5d4d;font-weight:600;text-decoration:none;">Back to Guest Login</a></div>
</div></div>
<script>
const API="https://ca-smart-staycation-muqd.onrender.com/api";
document.getElementById("forgotPasswordForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("resetButton"),msg=document.getElementById("message");btn.disabled=true;btn.textContent="Sending...";try{const r=await fetch(`${API}/guest-auth/forgot-password`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim().toLowerCase()})});const d=await r.json();msg.textContent=d.message||"If an account exists, reset instructions will be sent.";msg.style.color=r.ok?"#0b5d4d":"#b42318";}catch(err){msg.textContent="Unable to connect to the server. Please try again.";msg.style.color="#b42318";}finally{btn.disabled=false;btn.textContent="Send Reset Link";}});
</script>
</body></html>
