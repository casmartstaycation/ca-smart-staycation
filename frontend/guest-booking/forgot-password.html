<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#063b32">
<title>Forgot Password | CA Smart Staycation</title>
<link rel="stylesheet" href="../css/style.css">
<style>
/* Forgot Password page — isolated responsive layout */
html, body.forgot-page {
    min-height: 100%;
}

body.forgot-page {
    min-height: 100vh;
    margin: 0;
    background:
        radial-gradient(circle at 15% 10%, rgba(201,164,76,.14), transparent 32%),
        radial-gradient(circle at 85% 90%, rgba(11,93,77,.14), transparent 35%),
        linear-gradient(135deg, #f8f4e9 0%, #eef3ee 100%);
    color: #18332d;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
}

.forgot-header {
    position: relative !important;
    inset: auto !important;
    width: 100%;
    min-height: 78px;
    padding: 14px clamp(18px, 5vw, 64px);
    display: flex;
    align-items: center;
    background: #063b32;
    border-bottom: 1px solid rgba(234,215,156,.35);
    box-shadow: 0 5px 20px rgba(6,59,50,.14);
    z-index: 1;
}

.forgot-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: #fff;
    text-decoration: none;
    min-width: 0;
}

.forgot-brand-mark {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #ead79c, #b88d35);
    color: #063b32;
    font: 700 17px/1 Arial, sans-serif;
    box-shadow: 0 5px 14px rgba(0,0,0,.18);
}

.forgot-brand strong,
.forgot-brand small {
    display: block;
}

.forgot-brand strong {
    font-size: clamp(17px, 3vw, 22px);
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: .2px;
}

.forgot-brand small {
    margin-top: 4px;
    color: #ead79c;
    font: 600 8px/1.2 Arial, sans-serif;
    letter-spacing: 1.5px;
}

.forgot-main {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(28px, 7vw, 72px) 18px;
}

.forgot-card {
    width: min(100%, 500px);
    padding: clamp(28px, 6vw, 48px);
    background: rgba(255,255,255,.97);
    border: 1px solid #ded7c5;
    border-top: 4px solid #c9a44c;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(6,59,50,.13);
}

.forgot-eyebrow {
    margin: 0 0 8px;
    color: #9b7428;
    font: 700 11px/1.4 Arial, sans-serif;
    letter-spacing: 2.5px;
}

.forgot-card h1 {
    margin: 0;
    color: #063b32;
    font-size: clamp(30px, 7vw, 42px);
    line-height: 1.15;
    font-weight: 500;
}

.forgot-intro {
    margin: 14px 0 28px;
    color: #6b746f;
    font: 15px/1.65 Arial, sans-serif;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #18332d;
    font: 700 13px/1.4 Arial, sans-serif;
}

.form-group input {
    width: 100%;
    min-height: 50px;
    padding: 13px 14px;
    border: 1px solid #cfc8b7;
    border-radius: 6px;
    outline: none;
    background: #fff;
    color: #18332d;
    font: 16px/1.4 Arial, sans-serif;
    transition: border-color .2s, box-shadow .2s;
}

.form-group input:focus {
    border-color: #0b5d4d;
    box-shadow: 0 0 0 3px rgba(11,93,77,.12);
}

.continue-button {
    width: 100%;
    min-height: 50px;
    padding: 13px 18px;
    border: 0;
    border-radius: 6px;
    background: linear-gradient(135deg, #0b5d4d, #063b32);
    color: #fff;
    cursor: pointer;
    font: 700 14px/1.4 Arial, sans-serif;
    letter-spacing: .4px;
    box-shadow: 0 8px 20px rgba(6,59,50,.18);
    transition: transform .2s, box-shadow .2s, opacity .2s;
}

.continue-button span {
    margin-left: 7px;
    color: #ead79c;
    font-size: 18px;
}

.continue-button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(6,59,50,.24);
}

.continue-button:disabled {
    cursor: wait;
    opacity: .7;
}

.forgot-message {
    display: none;
    margin: 16px 0 0;
    padding: 12px 14px;
    border-radius: 6px;
    background: #f3f7f4;
    font: 13px/1.5 Arial, sans-serif;
}

.forgot-divider {
    height: 1px;
    margin: 26px 0 18px;
    background: #e5dfd0;
}

.back-login {
    display: block;
    color: #0b5d4d;
    text-align: center;
    text-decoration: none;
    font: 600 13px/1.4 Arial, sans-serif;
}

.back-login:hover {
    text-decoration: underline;
}

.forgot-footer {
    padding: 18px;
    color: #6b746f;
    text-align: center;
    font: 11px/1.4 Arial, sans-serif;
    border-top: 1px solid rgba(222,215,197,.75);
}

@media (max-width: 480px) {
    .forgot-header {
        min-height: 70px;
        padding: 12px 16px;
    }

    .forgot-brand-mark {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
        font-size: 15px;
    }

    .forgot-brand strong {
        font-size: 16px;
    }

    .forgot-brand small {
        font-size: 7px;
        letter-spacing: 1.1px;
    }

    .forgot-main {
        align-items: flex-start;
        padding: 26px 14px 34px;
    }

    .forgot-card {
        padding: 26px 20px;
        border-radius: 10px;
    }

    .forgot-intro {
        font-size: 14px;
        margin-bottom: 24px;
    }
}
</style>
</head>
<body class="forgot-page">
<header class="forgot-header">
    <a class="forgot-brand" href="../index.html" aria-label="CA Smart Staycation home">
        <span class="forgot-brand-mark">CA</span>
        <span><strong>CA Smart Staycation</strong><small>PRIVATE • ELEGANT • COMFORT</small></span>
    </a>
</header>
<main class="forgot-main">
    <section class="forgot-card" aria-labelledby="forgotTitle">
        <p class="forgot-eyebrow">GUEST ACCOUNT</p>
        <h1 id="forgotTitle">Forgot Password?</h1>
        <p class="forgot-intro">Enter the email address you used for your CA Smart Staycation booking. If an account exists, we'll send instructions to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
            </div>
            <button type="submit" class="continue-button" id="resetButton" type="submit">Send Reset Link <span>→</span></button>
        </form>
        <p id="message" class="forgot-message" role="status" aria-live="polite"></p>
        <div class="forgot-divider"></div>
        <a class="back-login" href="guest-login.html">← Back to Guest Login</a>
    </section>
</main>
<footer class="forgot-footer">© 2026 CA Smart Staycation. All rights reserved.</footer>
<script src="js/forgot-password.js"></script>
</body>
</html>
