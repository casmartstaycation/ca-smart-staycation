<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | CA Smart Staycation</title>
<link rel="stylesheet" href="../css/style.css">
<style>
    body.forgot-page{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#f8f4e9 0%,#eef3ee 55%,#e6efe9 100%);}
    .forgot-header{height:80px;flex:none;background:var(--emerald-dark);display:flex;align-items:center;justify-content:space-between;padding:0 60px;box-shadow:0 3px 15px rgba(0,0,0,.12)}
    .forgot-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}.forgot-brand-mark{width:42px;height:42px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:700;letter-spacing:1px}.forgot-brand strong{font-size:18px}.forgot-brand small{display:block;color:#d9e4df;font-size:11px;letter-spacing:1px;margin-top:1px}
    .forgot-main{width:100%;flex:1;display:flex;align-items:center;justify-content:center;padding:50px 20px}.forgot-card{width:min(100%,500px);background:var(--white);border:1px solid var(--border);border-radius:16px;padding:42px;box-shadow:var(--shadow);text-align:left}.forgot-eyebrow{color:var(--gold-dark);font-size:12px;font-weight:700;letter-spacing:2px;text-align:center;margin-bottom:7px}.forgot-card h1{text-align:center;color:var(--emerald-dark);font-size:30px;margin-bottom:10px}.forgot-intro{text-align:center;color:var(--text-light);font-size:14px;line-height:1.7;margin-bottom:28px}.forgot-card .form-group{margin-bottom:20px}.forgot-card label{display:block;color:var(--text-dark);font-weight:700;margin-bottom:7px}.forgot-card input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-dark);font:inherit;outline:none}.forgot-card input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,76,.14)}.forgot-card .continue-button{width:100%;margin-top:4px}.forgot-message{display:none;margin-top:18px;padding:12px 14px;border-radius:8px;background:#f7f3e8;font-size:14px;line-height:1.5;text-align:center}.forgot-divider{height:1px;background:var(--border);margin:25px 0 18px}.back-login{display:block;text-align:center;color:var(--emerald)!important;font-weight:700;text-decoration:none}.back-login:hover{text-decoration:underline}.forgot-footer{text-align:center;padding:0 20px 25px;color:var(--text-light);font-size:12px}
    @media(max-width:600px){.forgot-header{height:70px;padding:0 18px}.forgot-brand strong{font-size:15px}.forgot-main{padding:30px 14px}.forgot-card{padding:30px 22px}.forgot-card h1{font-size:26px}.forgot-brand small{display:none}}
</style>
</head>
<body class="forgot-page">
<header class="forgot-header">
    <a class="forgot-brand" href="../index.html" aria-label="CA Smart Staycation home">
        <span class="forgot-brand-mark">CA</span>
        <span><strong>CA Smart Staycation</strong><small>PRIVATE • ELEGANT • COMFORT</small></span>
    </a>
</header>
<main class="forgot-main">
    <section class="forgot-card" aria-labelledby="forgotTitle">
        <p class="forgot-eyebrow">GUEST ACCOUNT</p>
        <h1 id="forgotTitle">Forgot Password?</h1>
        <p class="forgot-intro">Enter the email address you used for your CA Smart Staycation booking. If an account exists, we'll send instructions to reset your password.</p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
            </div>
            <button type="submit" class="continue-button" id="resetButton">Send Reset Link <span>→</span></button>
        </form>
        <p id="message" class="forgot-message" role="status"></p>
        <div class="forgot-divider"></div>
        <a class="back-login" href="guest-login.html">← Back to Guest Login</a>
    </section>
</main>
<footer class="forgot-footer">© 2026 CA Smart Staycation. All rights reserved.</footer>
<script>
const API="https://ca-smart-staycation-muqd.onrender.com/api";
document.getElementById("forgotPasswordForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=document.getElementById("resetButton"),msg=document.getElementById("message");
    btn.disabled=true;btn.innerHTML="Sending...";msg.style.display="none";
    try{
        const r=await fetch(`${API}/guest-auth/forgot-password`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim().toLowerCase()})});
        const d=await r.json();
        msg.textContent=d.message||"If an account exists, reset instructions will be sent.";
        msg.style.color=r.ok?"#0b5d4d":"#b42318";msg.style.display="block";
    }catch(err){msg.textContent="Unable to connect to the server. Please try again.";msg.style.color="#b42318";msg.style.display="block";}
    finally{btn.disabled=false;btn.innerHTML="Send Reset Link <span>→</span>";}
});
</script>
</body>
</html>
