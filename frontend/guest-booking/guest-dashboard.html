<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Bookings | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:950px;margin:40px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center;margin-bottom:5px}.subtitle,.updated{text-align:center;color:#666}.updated{color:#888;font-size:13px;margin-bottom:25px}.section-title{font-size:18px;font-weight:bold;color:#0b5d4d;margin:25px 0 12px;border-bottom:1px solid #ddd;padding-bottom:8px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar button{width:auto;margin:0;padding:10px 16px}.badge{display:inline-block;min-width:20px;padding:2px 7px;border-radius:999px;background:#b42318;color:#fff;font-size:12px}.notification{padding:13px 15px;border:1px solid #ead6a4;background:#fff8e8;border-radius:9px;margin:9px 0;line-height:1.5}.notification.unread{border-left:5px solid #c9a44c}.inbox{display:none;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:20px;background:#fafcfb}.inbox.open{display:block}.messages{max-height:360px;overflow:auto;margin-bottom:15px}.msg{padding:11px 13px;border-radius:9px;margin:8px 0;max-width:82%;line-height:1.5}.msg.guest{margin-left:auto;background:#e9f3ee}.msg.admin{background:#eef2f5}.msg small{display:block;color:#68736e;margin-bottom:4px}.attachment{display:inline-block;margin:5px 5px 0 0;padding:6px 9px;border:1px solid #ccd5d1;border-radius:6px;background:#fff;color:#0b5d4d;text-decoration:none;font-size:12px}.message-compose textarea{width:100%;min-height:80px;box-sizing:border-box;padding:10px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;resize:vertical}.message-compose input[type=file]{margin-top:9px}.message-compose button{margin-top:9px}.booking-card{border:1px solid #ddd;border-radius:10px;padding:20px;margin:15px 0;background:#fff}.reference{font-size:22px;font-weight:bold;color:#c9a44c;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:20px;margin:9px 0}.label{font-weight:bold}.status{padding:12px;border-radius:8px;text-align:center;font-weight:bold;background:#fff8e8;border-left:5px solid #c9a44c;margin:15px 0}.note{background:#f7faf9;padding:15px;border-left:5px solid #0b5d4d;line-height:1.6;margin-top:18px}button{width:100%;margin-top:15px;padding:13px;border:none;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:16px}.secondary{background:#c9a44c}.danger{background:#b42318}.danger:hover{background:#8f1d14}.logout{background:#777}.error{text-align:center;color:#b42318;padding:20px}.refreshing{opacity:.65}.empty{text-align:center;padding:30px;color:#666}.booking-actions{margin-top:15px}.booking-actions button{margin-top:8px}.refund-note{margin-top:10px;padding:10px;background:#fff8e8;border-left:4px solid #c9a44c;font-size:14px;line-height:1.5}.refund-done{background:#e9f3ee;border-left-color:#0b5d4d}@media(max-width:600px){.container{margin:15px;padding:18px}.toolbar{flex-direction:column}.row{gap:10px}.msg{max-width:92%}}</style></head>
<body><div class="container"><h1>My Bookings</h1><p class="subtitle">CA Smart Staycation Guest Account</p><div class="updated" id="updated">Checking latest booking status...</div><div class="toolbar"><button id="notificationBtn" type="button">Notifications <span id="notificationBadge" class="badge" hidden>0</span></button><button id="inboxBtn" type="button">Message Inbox <span id="messageBadge" class="badge" hidden>0</span></button></div><section id="inbox" class="inbox"><div class="section-title">Message Inbox</div><div id="notificationsList"></div><div id="messagesList" class="messages"><div class="empty">Loading messages...</div></div><div class="message-compose"><textarea id="messageText" placeholder="Send a message to CA Smart Staycation admin..."></textarea><input id="messageFiles" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" multiple><button id="sendMessage" type="button">Send Message</button></div></section><div class="section-title">Reservations</div><div id="bookingsList"><div class="empty">Loading bookings...</div></div><div class="note">All bookings made using your registered email address are shown here. Each reservation has its own booking reference and payment status.</div><button onclick="location.href='../index.html'">Make Another Booking</button><button class="logout" id="logout">Logout</button></div>
<script>
const API="https://ca-smart-staycation-muqd.onrender.com/api",tokenKey="guestAuthToken";let loading=false,inboxData={messages:[],notifications:[]};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function textStatus(s){if(s==="Pending Payment Verification")return"Payment received — waiting for admin verification";if(s==="Payment Rejected")return"Payment proof rejected — action required";if(s==="Reserved"||s==="Confirmed")return"Booking Confirmed";if(s==="Checked In")return"Checked In";if(s==="Checked Out")return"Checked Out";if(s==="Cancelled")return"Booking Cancelled";if(s==="Expired")return"Booking Expired";return s||"Pending"}
function dateText(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?String(v).substring(0,10):d.toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"})}
function active(b){return ["Reserved","Pending Payment Verification","Payment Rejected"].includes(b.bookingStatus)&&new Date(b.checkIn).getTime()>Date.now()}
function policyPreview(b){const total=Math.max(0,Number(b.totalAmount||0));const paidAt=b.paymentProofSubmittedAt||b.paymentDate||b.createdAt;const hours=paidAt?(Date.now()-new Date(paidAt).getTime())/3600000:Infinity;const days=(new Date(b.checkIn).getTime()-Date.now())/86400000;if(hours<=1)return{rule:"Within 1 hour after payment proof submission",fee:Math.min(500,total),refund:Math.max(0,total-500)};if(days>=3)return{rule:"3 days or more before check-in",fee:Math.min(1000,total),refund:Math.max(0,total-1000)};if(days>=0)return{rule:"2 days before check-in through check-in date",fee:Math.round(total*.5),refund:Math.round(total*.5)};return{rule:"Past check-in",fee:total,refund:0}}
async function cancelBooking(b,button){if(!active(b))return;const hasPayment=b.paymentStatus==="Paid"||Boolean(b.paymentProof);const p=hasPayment?policyPreview(b):{rule:"No payment recorded",fee:0,refund:0};const details=hasPayment?`Cancellation rule: ${p.rule}\nInconvenience fee: ₱${p.fee.toLocaleString()}\nEstimated refund: ₱${p.refund.toLocaleString()}`:`No payment recorded. No refund or inconvenience fee applies.`;if(!confirm(`Cancel booking ${b.bookingReference}?\n\n${details}\n\nContinue?`))return;button.disabled=true;button.textContent="Cancelling...";try{const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(b._id)}/cancel`,{method:"POST",headers:{Authorization:`Bearer ${localStorage.getItem(tokenKey)}`,"Content-Type":"application/json"},body:JSON.stringify({reason:"Guest requested cancellation"})});const data=await r.json();if(!r.ok)throw Error(data.message||"Unable to cancel this booking.");alert(data.message||"Booking cancelled successfully.");await load(true);await loadInbox();}catch(e){alert(e.message||"Unable to cancel booking.");button.disabled=false;button.textContent="Cancel Booking"}}
function renderBooking(b){const card=document.createElement("div");card.className="booking-card";let message="Your booking status is shown above.";if(b.bookingStatus==="Pending Payment Verification")message="Your payment proof has been received. Please wait while our administrator verifies your payment.";if(b.bookingStatus==="Payment Rejected")message="The submitted payment proof could not be verified. Please submit a new valid payment proof.";if(b.bookingStatus==="Reserved"||b.bookingStatus==="Confirmed")message="Your payment has been verified and your reservation is confirmed.";if(b.bookingStatus==="Expired")message="This booking expired because payment was not settled within the allowed payment period.";if(b.bookingStatus==="Cancelled")message=b.refundStatus==="Refunded"?"This booking was cancelled and the refund has been processed by the administrator.":b.refundStatus==="Requested"||b.refundStatus==="Processing"?"This booking was cancelled. Your refund request is being processed by the administrator.":"This booking was cancelled and its reserved dates have been released.";card.innerHTML=`<div class="reference">${esc(b.bookingReference||"N/A")}</div><div class="status">${esc(textStatus(b.bookingStatus))}</div><div class="row"><span class="label">Check-in</span><span>${dateText(b.checkIn)}</span></div><div class="row"><span class="label">Check-out</span><span>${dateText(b.checkOut)}</span></div><div class="row"><span class="label">Guests</span><span>${b.adults||0} adult(s), ${b.children||0} child(ren)</span></div><div class="row"><span class="label">Payment</span><span>${esc(b.paymentStatus||"Pending")}</span></div><div class="row"><span class="label">Total Amount</span><strong>₱${Number(b.totalAmount||0).toLocaleString()}</strong></div><div class="note">${esc(message)}</div>`;const actions=document.createElement("div");actions.className="booking-actions";if(b.bookingStatus==="Payment Rejected"){const btn=document.createElement("button");btn.className="secondary";btn.textContent="Submit New Payment Proof";btn.onclick=()=>{localStorage.setItem("guestBooking",JSON.stringify(b));location.href="payment.html"};actions.appendChild(btn)}if(active(b)){const cancelBtn=document.createElement("button");cancelBtn.className="danger";cancelBtn.textContent="Cancel Booking";cancelBtn.onclick=()=>cancelBooking(b,cancelBtn);actions.appendChild(cancelBtn)}if(b.refundStatus==="Requested"||b.refundStatus==="Processing"||b.refundStatus==="Refunded"){const refund=document.createElement("div");refund.className=`refund-note ${b.refundStatus==="Refunded"?"refund-done":""}`;refund.textContent=b.refundStatus==="Refunded"?`Refund processed: ₱${Number(b.refundAmount||0).toLocaleString()}.`:`Refund requested: ₱${Number(b.refundAmount||0).toLocaleString()}. Waiting for administrator processing.`;actions.appendChild(refund)}if(actions.children.length)card.appendChild(actions);return card}
function render(bookings){const list=document.getElementById("bookingsList");list.innerHTML="";if(!bookings.length){list.innerHTML='<div class="empty">No bookings found for this account.</div>';return}bookings.forEach(b=>list.appendChild(renderBooking(b)))}
function renderInbox(){const unreadN=inboxData.notifications.filter(n=>!n.read).length,unreadM=inboxData.messages.filter(m=>!m.readByGuest).length;const nb=document.getElementById("notificationBadge"),mb=document.getElementById("messageBadge");nb.textContent=unreadN;nb.hidden=!unreadN;mb.textContent=unreadM;mb.hidden=!unreadM;document.getElementById("notificationsList").innerHTML=inboxData.notifications.map(n=>`<div class="notification ${n.read?"":"unread"}"><strong>${esc(n.title)}</strong><div>${esc(n.message)}</div><small>${dateText(n.createdAt)}</small></div>`).join("")||'<div class="empty">No notifications.</div>';document.getElementById("messagesList").innerHTML=inboxData.messages.map(m=>`<div class="msg ${m.senderType}"><small>${esc(m.senderName||m.senderType)} · ${dateText(m.createdAt)}</small>${esc(m.message)}${(m.attachments||[]).map(a=>`<a class="attachment" target="_blank" rel="noopener" href="${a.data}">${esc(a.name)}</a>`).join("")}</div>`).join("")||'<div class="empty">No messages yet.</div>';const box=document.getElementById("messagesList");box.scrollTop=box.scrollHeight}
async function loadInbox(){try{const r=await fetch(`${API}/guest/inbox`,{headers:{Authorization:`Bearer ${localStorage.getItem(tokenKey)}`},cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.message||"Unable to load inbox.");inboxData=d;renderInbox()}catch(e){console.error(e)}}
async function sendMessage(){const text=document.getElementById("messageText").value.trim(),files=[...document.getElementById("messageFiles").files];if(!text&&!files.length){alert("Enter a message or attach a file.");return}if(files.length>3){alert("You can attach up to 3 files.");return}try{const attachments=await Promise.all(files.map(f=>new Promise((resolve,reject)=>{if(f.size>5*1024*1024)return reject(Error(`${f.name} is larger than 5 MB.`));const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type,data:r.result});r.onerror=()=>reject(Error("Unable to read attachment."));r.readAsDataURL(f)})));const r=await fetch(`${API}/guest/messages`,{method:"POST",headers:{Authorization:`Bearer ${localStorage.getItem(tokenKey)},"Content-Type":"application/json"`},body:JSON.stringify({message:text,attachments})});const d=await r.json();if(!r.ok)throw Error(d.message||"Unable to send message.");document.getElementById("messageText").value="";document.getElementById("messageFiles").value="";await loadInbox()}catch(e){alert(e.message||"Unable to send message.")}}
async function markInboxRead(){try{await fetch(`${API}/guest/inbox/read`,{method:"PUT",headers:{Authorization:`Bearer ${localStorage.getItem(tokenKey)}}});await loadInbox()}catch(e){console.error(e)}}
async function load(silent=false){const token=localStorage.getItem(tokenKey);if(!token){location.href="guest-login.html";return}if(loading)return;loading=true;try{const r=await fetch(`${API}/guest-auth/me`,{headers:{Authorization:`Bearer ${token}`},cache:"no-store"});const data=await r.json();if(!r.ok){localStorage.removeItem(tokenKey);location.href="guest-login.html";return}if(data.account?.mustChangePassword){location.replace("change-password.html");return}render(data.bookings||[]);document.getElementById("updated").textContent="Last updated: "+new Date().toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit",second:"2-digit"})}catch(e){console.error(e);if(!silent)document.getElementById("bookingsList").innerHTML='<div class="error">Unable to load your bookings. Please try again.</div>'}finally{loading=false}}
document.getElementById("notificationBtn").onclick=async()=>{document.getElementById("inbox").classList.add("open");await loadInbox();await markInboxRead()};document.getElementById("inboxBtn").onclick=async()=>{document.getElementById("inbox").classList.add("open");await loadInbox();await markInboxRead()};document.getElementById("sendMessage").onclick=sendMessage;document.getElementById("logout").onclick=()=>{localStorage.removeItem(tokenKey);localStorage.removeItem("guestAccount");localStorage.removeItem("guestBooking");location.href="guest-login.html"};load();loadInbox();setInterval(()=>{load(true);loadInbox()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden){load(true);loadInbox()}});
</script></body></html>
