<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | CA Smart Staycation</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:900px;margin:40px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center;margin-bottom:5px}.subtitle{text-align:center;color:#666}.updated{text-align:center;color:#888;font-size:13px;margin-bottom:25px}.section-title{font-size:18px;font-weight:bold;color:#0b5d4d;margin:25px 0 12px;border-bottom:1px solid #ddd;padding-bottom:8px}.booking-card{border:1px solid #ddd;border-radius:10px;padding:20px;margin:15px 0;background:#fff}.reference{font-size:22px;font-weight:bold;color:#c9a44c;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:20px;margin:9px 0}.label{font-weight:bold}.status{padding:12px;border-radius:8px;text-align:center;font-weight:bold;background:#fff8e8;border-left:5px solid #c9a44c;margin:15px 0}.note{background:#f7faf9;padding:15px;border-left:5px solid #0b5d4d;line-height:1.6;margin-top:18px}button{width:100%;margin-top:15px;padding:13px;border:none;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:16px}.secondary{background:#c9a44c}.danger{background:#b42318}.danger:hover{background:#8f1d14}.logout{background:#777}.error{text-align:center;color:#b42318;padding:20px}.refreshing{opacity:.65}.empty{text-align:center;padding:30px;color:#666}.booking-actions{margin-top:15px}.booking-actions button{margin-top:8px}.reschedule-box{display:none;margin-top:12px;padding:15px;background:#fafafa;border:1px solid #ddd;border-radius:8px}.reschedule-box.open{display:block}.reschedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.reschedule-grid label{font-weight:600;font-size:14px}.reschedule-grid input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.reschedule-actions{display:flex;gap:8px}.reschedule-actions button{margin-top:10px}.refund-note{margin-top:10px;padding:10px;background:#fff8e8;border-left:4px solid #c9a44c;font-size:14px;line-height:1.5}@media(max-width:600px){.reschedule-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>My Bookings</h1>
<p class="subtitle">CA Smart Staycation Guest Account</p>
<div class="updated" id="updated">Checking latest booking status...</div>
<div class="section-title">Reservations</div>
<div id="bookingsList"><div class="empty">Loading bookings...</div></div>
<div class="note">All bookings made using your registered email address are shown here. Each reservation has its own booking reference and payment status.</div>
<button onclick="location.href='../index.html'">Make Another Booking</button>
<button class="logout" id="logout">Logout</button>
</div>
<script>
const API="https://ca-smart-staycation-muqd.onrender.com/api";
const tokenKey="guestAuthToken";
let loading=false;
function textStatus(status){if(status==="Pending Payment Verification")return"Payment received — waiting for admin verification";if(status==="Payment Rejected")return"Payment proof rejected — action required";if(status==="Reserved"||status==="Confirmed")return"Booking Confirmed";if(status==="Checked In")return"Checked In";if(status==="Checked Out")return"Checked Out";if(status==="Cancelled")return"Booking Cancelled";if(status==="Expired")return"Booking Expired";return status||"Pending";}
function dateText(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?String(v).substring(0,10):d.toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"});}
function isoDate(v){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v).substring(0,10);return d.toISOString().substring(0,10);}
function active(b){return ["Reserved","Pending Payment Verification","Payment Rejected"].includes(b.bookingStatus)&&new Date(b.checkIn).getTime()>Date.now();}
function canCancel(b){return active(b);}
async function cancelBooking(b,button){
  if(!canCancel(b))return;
  const hasPayment=b.paymentStatus==="Paid"||Boolean(b.paymentProof);
  const confirmed=confirm(`Cancel booking ${b.bookingReference}?\n\n${hasPayment?"A refund request will be submitted to the administrator for processing. The refund amount is based on the booking total." : "The booking will be cancelled and the reserved dates released."}\n\nContinue?`);
  if(!confirmed)return;
  button.disabled=true;button.textContent="Cancelling...";
  const token=localStorage.getItem(tokenKey);
  try{
    const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(b._id)}/cancel`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({reason:"Guest requested cancellation"}),cache:"no-store"});
    const data=await r.json();
    if(!r.ok){alert(data.message||"Unable to cancel this booking.");button.disabled=false;button.textContent="Cancel Booking";return;}
    alert(data.message||"Booking cancelled successfully.");
    await load(true);
  }catch(e){console.error(e);alert("Unable to connect to the server. Please try again.");button.disabled=false;button.textContent="Cancel Booking";}
}
async function rescheduleBooking(b,button,box){
  const checkIn=box.querySelector(".new-check-in").value;
  const checkOut=box.querySelector(".new-check-out").value;
  if(!checkIn||!checkOut){alert("Please select both a new check-in and check-out date.");return;}
  if(checkOut<=checkIn){alert("Check-out must be after check-in.");return;}
  const confirmed=confirm(`Change booking ${b.bookingReference} to:\n\nCheck-in: ${checkIn}\nCheck-out: ${checkOut}\n\nThe system will check whether the accommodation and parking are available for the new dates.`);
  if(!confirmed)return;
  button.disabled=true;button.textContent="Checking availability...";
  try{
    const token=localStorage.getItem(tokenKey);
    const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(b._id)}/reschedule`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({checkIn,checkOut}),cache:"no-store"});
    const data=await r.json();
    if(!r.ok){alert(data.message||"The selected dates are unavailable.");button.disabled=false;button.textContent="Change Dates";return;}
    alert(data.message||"Booking dates changed successfully.");
    await load(true);
  }catch(e){console.error(e);alert("Unable to connect to the server. Please try again.");button.disabled=false;button.textContent="Change Dates";}
}
function renderBooking(b){
  const card=document.createElement("div");card.className="booking-card";
  let message="Your booking status is shown above.";
  if(b.bookingStatus==="Pending Payment Verification")message="Your payment proof has been received. Please wait while our administrator verifies your payment.";
  if(b.bookingStatus==="Payment Rejected")message="The submitted payment proof could not be verified. Please submit a new valid payment proof.";
  if(b.bookingStatus==="Reserved"||b.bookingStatus==="Confirmed")message="Your payment has been verified and your reservation is confirmed.";
  if(b.bookingStatus==="Expired")message="This booking expired because payment was not settled within the allowed payment period.";
  if(b.bookingStatus==="Cancelled")message=b.refundStatus==="Requested"||b.refundStatus==="Processing"?"This booking was cancelled. Your refund request is being processed by the administrator.":"This booking was cancelled and its reserved dates have been released.";
  card.innerHTML=`<div class="reference">${b.bookingReference||"N/A"}</div><div class="status">${textStatus(b.bookingStatus)}</div><div class="row"><span class="label">Check-in</span><span>${dateText(b.checkIn)}</span></div><div class="row"><span class="label">Check-out</span><span>${dateText(b.checkOut)}</span></div><div class="row"><span class="label">Guests</span><span>${b.adults||0} adult(s), ${b.children||0} child(ren)</span></div><div class="row"><span class="label">Payment</span><span>${b.paymentStatus||"Pending"}</span></div><div class="row"><span class="label">Total Amount</span><strong>₱${Number(b.totalAmount||0).toLocaleString()}</strong></div><div class="note">${message}</div>`;
  const actions=document.createElement("div");actions.className="booking-actions";
  if(b.bookingStatus==="Payment Rejected"){
    const btn=document.createElement("button");btn.className="secondary";btn.textContent="Submit New Payment Proof";btn.onclick=()=>{localStorage.setItem("guestBooking",JSON.stringify(b));location.href="payment.html"};actions.appendChild(btn);
  }
  if(active(b)){
    const rescheduleBtn=document.createElement("button");rescheduleBtn.className="secondary";rescheduleBtn.textContent="Change Booking Dates";
    const box=document.createElement("div");box.className="reschedule-box";
    const minDate=new Date();minDate.setDate(minDate.getDate()+1);const min=isoDate(minDate);
    box.innerHTML=`<div class="reschedule-grid"><label>New Check-in<input class="new-check-in" type="date" min="${min}" value="${isoDate(b.checkIn)}"></label><label>New Check-out<input class="new-check-out" type="date" min="${min}" value="${isoDate(b.checkOut)}"></label></div><div class="reschedule-actions"><button type="button" class="change-date-submit">Change Dates</button><button type="button" class="logout close-reschedule">Close</button></div><div class="refund-note">Your original booking dates will be released only after the new dates pass the availability check. Your payment and booking reference remain associated with this reservation.</div>`;
    rescheduleBtn.onclick=()=>box.classList.toggle("open");
    box.querySelector(".change-date-submit").onclick=()=>rescheduleBooking(b,box.querySelector(".change-date-submit"),box);
    box.querySelector(".close-reschedule").onclick=()=>box.classList.remove("open");
    actions.appendChild(rescheduleBtn);actions.appendChild(box);

    const cancelBtn=document.createElement("button");cancelBtn.className="danger";cancelBtn.textContent="Cancel Booking";cancelBtn.onclick=()=>cancelBooking(b,cancelBtn);actions.appendChild(cancelBtn);
  }
  if(b.refundStatus==="Requested"||b.refundStatus==="Processing"){
    const refund=document.createElement("div");refund.className="refund-note";refund.textContent=`Refund requested: ₱${Number(b.refundAmount||b.totalAmount||0).toLocaleString()}. Waiting for administrator processing.`;actions.appendChild(refund);
  }
  if(actions.children.length)card.appendChild(actions);
  localStorage.setItem("guestBooking",JSON.stringify(b));return card;
}
function render(bookings){const list=document.getElementById("bookingsList");list.innerHTML="";if(!bookings.length){list.innerHTML='<div class="empty">No bookings found for this account.</div>';return;}bookings.forEach(b=>list.appendChild(renderBooking(b)));}
async function load(silent=false){const token=localStorage.getItem(tokenKey);if(!token){location.href="guest-login.html";return;}if(loading)return;loading=true;const list=document.getElementById("bookingsList");if(!silent)list.classList.add("refreshing");try{const r=await fetch(`${API}/guest-auth/me`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/json"},cache:"no-store"});const data=await r.json();if(!r.ok){localStorage.removeItem(tokenKey);localStorage.removeItem("guestAccount");location.href="guest-login.html";return;}if(data.account?.mustChangePassword){location.replace("change-password.html");return;}render(data.bookings||[]);document.getElementById("updated").textContent="Last updated: "+new Date().toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit",second:"2-digit"});}catch(e){console.error(e);if(!silent)list.innerHTML='<div class="error">Unable to load your bookings. Please try again.</div>';}finally{loading=false;list.classList.remove("refreshing");}}
document.getElementById("logout").onclick=()=>{localStorage.removeItem(tokenKey);localStorage.removeItem("guestAccount");localStorage.removeItem("guestBooking");location.href="guest-login.html"};
load();setInterval(()=>load(true),30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(true);});
</script>
</body>
</html>
