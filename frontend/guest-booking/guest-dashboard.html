<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | CA Smart Staycation</title><link rel="stylesheet" href="../css/mobile-responsive.css?v=20260815-7"><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:950px;margin:40px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center;margin:0}.subtitle,.updated{text-align:center;color:#666}.updated{font-size:13px;margin-bottom:20px}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar button{width:auto;margin:0}.badge{display:inline-block;min-width:18px;padding:2px 6px;border-radius:999px;background:#b42318;color:#fff;font-size:11px}.panel{display:none;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:20px;background:#fafcfb}.panel.open{display:block}.section-title{font-size:18px;font-weight:bold;color:#0b5d4d;margin:0 0 12px;border-bottom:1px solid #ddd;padding-bottom:8px}.notification,.message{border:1px solid #e1e6e3;border-radius:8px;padding:11px 13px;margin:8px 0;line-height:1.5}.notification{background:#fff8e8;border-left:4px solid #c9a44c}.notification.unread{font-weight:600}.message.guest{margin-left:15%;background:#e9f3ee}.message.admin{margin-right:15%;background:#eef2f5}.message small{display:block;color:#78827e;font-size:11px;margin-bottom:5px}.attachment{display:inline-block;margin:6px 5px 0 0;padding:6px 9px;border:1px solid #ccd5d1;border-radius:6px;background:#fff;color:#0b5d4d;text-decoration:none;font-size:12px}.compose textarea{width:100%;min-height:80px;box-sizing:border-box;padding:10px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;resize:vertical}.compose input{margin-top:9px}.booking-tools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:18px 0 12px}.booking-tools input,.booking-tools select{width:100%;box-sizing:border-box;height:42px;padding:9px 11px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;background:#fff}.booking-count{font-size:13px;color:#68736e;margin-bottom:10px}.booking-card{border:1px solid #ddd;border-radius:10px;margin:10px 0;background:#fff;overflow:hidden}.booking-summary{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 17px}.summary-main{min-width:0}.reference{font-size:18px;font-weight:bold;color:#c9a44c}.summary-meta{font-size:13px;color:#68736e;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary-right{text-align:right;white-space:nowrap}.summary-right strong{display:block;font-size:16px}.status-pill{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:999px;background:#fff8e8;border:1px solid #ead8a9;font-size:11px;font-weight:bold}.details{display:none;padding:0 17px 17px;border-top:1px solid #edf0ee}.booking-card.open .details{display:block}.details .row{display:flex;justify-content:space-between;gap:20px;margin:9px 0}.label{font-weight:bold}.note{background:#f7faf9;padding:15px;border-left:5px solid #0b5d4d;line-height:1.6;margin-top:14px}.refund{margin-top:10px;padding:10px;background:#fff8e8;border-left:4px solid #c9a44c}.refund.done{background:#e9f3ee;border-left-color:#0b5d4d}.booking-actions{display:flex;gap:8px;margin:12px 17px 17px}.booking-actions button{flex:1}button{width:100%;margin-top:10px;padding:12px;border:0;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:15px}.secondary{background:#c9a44c}.danger{background:#b42318}.logout{background:#777}.empty{text-align:center;padding:25px}.error{text-align:center;color:#b42318;padding:20px}.hidden{display:none!important}.tab-button.active{background:#c9a44c}@media(max-width:700px){.container{margin:12px;padding:16px;border-radius:12px}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.toolbar button{width:100%;font-size:13px;padding:10px 6px}.booking-tools{grid-template-columns:1fr}.booking-summary{align-items:flex-start;flex-direction:column}.summary-right{text-align:left}.booking-actions{flex-direction:column;margin:12px}.booking-actions button{width:100%}.message.guest,.message.admin{margin-left:0;margin-right:0}}@media(max-width:360px){.container{padding:10px}.toolbar{grid-template-columns:1fr}}</style></head><body><div class="container"><h1>My Bookings</h1><p class="subtitle">CA Smart Staycation Guest Account</p><div id="updated" class="updated">Checking latest status...</div><div class="toolbar"><button id="bookingsBtn" class="tab-button active" type="button">Bookings</button><button id="notificationBtn" class="tab-button" type="button">Notifications <span id="notificationBadge" class="badge" hidden>0</span></button><button id="inboxBtn" class="tab-button" type="button">Message Inbox <span id="messageBadge" class="badge" hidden>0</span></button><button id="newBookingBtn" class="tab-button" type="button">Make Another Booking</button><button id="settingsBtn" class="tab-button" type="button">Account Settings</button><button class="logout" id="logout" type="button">Logout</button></div><section id="notificationPanel" class="panel"><div class="section-title">Notifications</div><div id="notificationsList"></div></section><section id="messagePanel" class="panel"><div class="section-title">Messages</div><div id="messagesList"></div><div class="compose"><textarea id="messageText" placeholder="Send a message to CA Smart Staycation admin..."></textarea><input id="messageFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"><button id="sendMessage" type="button">Send Message</button></div></section><section id="bookingsPanel"><div class="section-title">Reservations</div><div class="booking-tools"><input id="bookingSearch" type="search" placeholder="Search booking reference..."><select id="bookingFilter"><option value="all">All Bookings</option><option value="active">Active</option><option value="pending">Pending Payment</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option><option value="completed">Completed</option></select></div><div id="bookingCount" class="booking-count"></div><div id="bookingsList"><div class="empty">Loading bookings...</div></div><button id="loadMore" class="secondary hidden" type="button">Load More</button><div class="note">All bookings made using your registered email address are shown here.</div></section></div><script src="guest-dashboard.js?v=20260815-9"></script><script src="guest-cancellation-policy.js?v=20260822-1"></script><script src="guest-dashboard-extra-payment.js?v=20260815-102"></script><script src="guest-dashboard-extra-request-fix.js?v=20260815-2"></script><script src="guest-dashboard-inbox-api-fix.js?v=20260815-2"></script><script>
(function(){'use strict';
var messageMode=false;
function activate(id){document.querySelectorAll('.tab-button').forEach(function(b){b.classList.remove('active')});var b=document.getElementById(id);if(b)b.classList.add('active')}
function showPanel(name){var bp=document.getElementById('bookingsPanel'),np=document.getElementById('notificationPanel'),mp=document.getElementById('messagePanel');if(bp)bp.style.display=name==='bookings'?'block':'none';if(np){np.style.display=name==='notifications'?'block':'none';np.classList.toggle('open',name==='notifications')}if(mp){mp.style.display=name==='messages'?'block':'none';mp.classList.toggle('open',name==='messages')}if(name==='bookings')activate('bookingsBtn');if(name==='notifications')activate('notificationBtn');if(name==='messages')activate('inboxBtn')}
function forceMessages(){if(!messageMode)return;var p=document.getElementById('messagePanel'),b=document.getElementById('inboxBtn'),bk=document.getElementById('bookingsPanel'),n=document.getElementById('notificationPanel');if(p){p.style.display='block';p.classList.add('open')}if(bk)bk.style.display='none';if(n){n.style.display='none';n.classList.remove('open')}if(b)b.classList.add('active');var buttons=document.querySelectorAll('.tab-button');buttons.forEach(function(x){if(x!==b)x.classList.remove('active')})}
function keepMessagesAfterSend(){messageMode=true;forceMessages();var end=Date.now()+30000;function tick(){if(!messageMode)return;forceMessages();if(Date.now()<end)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
document.addEventListener('click',function(e){var btn=e.target.closest&&e.target.closest('#bookingsBtn,#notificationBtn,#inboxBtn,#newBookingBtn,#settingsBtn');if(btn){e.preventDefault();e.stopImmediatePropagation();if(btn.id==='bookingsBtn'){messageMode=false;showPanel('bookings');return}if(btn.id==='notificationBtn'){messageMode=false;showPanel('notifications');return}if(btn.id==='inboxBtn'){messageMode=false;showPanel('messages');return}if(btn.id==='newBookingBtn'){messageMode=false;window.location.href='../index.html';return}if(btn.id==='settingsBtn'){messageMode=false;window.location.href='account-settings.html';return}}if(e.target.closest&&e.target.closest('#sendMessage'))keepMessagesAfterSend();var logout=e.target.closest&&e.target.closest('#logout');if(logout){e.preventDefault();e.stopImmediatePropagation();localStorage.removeItem('guestAuthToken');localStorage.removeItem('guestAccount');localStorage.removeItem('guestBooking');sessionStorage.removeItem('guestAuthToken');sessionStorage.removeItem('guestAccount');window.location.replace('guest-login.html');}},true);
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){showPanel('bookings')})}else{showPanel('bookings')}
})();
</script><script src="guest-account-customizer.js?v=20260823-1"></script></body></html>
