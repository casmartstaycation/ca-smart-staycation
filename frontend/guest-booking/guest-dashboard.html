<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Account | CA Smart Staycation</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:980px;margin:30px auto;background:#fff;padding:28px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center;margin:0 0 6px}.subtitle{text-align:center;color:#666;margin:0 0 22px}.guest-nav-actions{display:flex;justify-content:center;margin:0 0 18px}.make-booking{display:inline-block;text-decoration:none;background:#c9a44c;color:#fff;border-radius:8px;padding:12px 22px;font-weight:bold;text-align:center}.make-booking:hover{opacity:.9}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:22px}.tab-button{flex:1 1 180px;background:#eef4f2;color:#0b5d4d;border:1px solid #d4e2de;border-radius:9px;padding:12px 10px;font-size:15px;font-weight:bold;cursor:pointer}.tab-button.active{background:#0b5d4d;color:#fff}.badge{display:inline-flex;min-width:20px;height:20px;padding:0 5px;align-items:center;justify-content:center;border-radius:20px;background:#c9a44c;color:#fff;font-size:12px;margin-left:5px}.panel{display:none}.panel.active{display:block}.booking-card,.notice-card,.message-card,.account-card{border:1px solid #ddd;border-radius:10px;margin:10px 0;background:#fff;overflow:hidden}.booking-summary{display:flex;justify-content:space-between;gap:15px;padding:15px 17px}.reference{font-size:18px;font-weight:bold;color:#c9a44c}.details{display:none;padding:0 17px 17px;border-top:1px solid #edf0ee}.booking-card.open .details{display:block}.booking-actions{display:flex;gap:8px;margin:12px 17px 17px}.booking-actions button{flex:1}.secondary{background:#c9a44c!important}.danger{background:#b42318!important}.upload-payment{background:#0b5d4d!important}.addon-btn{background:#0b5d4d!important}.empty{text-align:center;padding:25px;color:#666}.notice-card,.message-card{padding:15px 17px}.notice-card.unread,.message-card.unread{border-left:5px solid #c9a44c;background:#fffdf7}.meta{font-size:13px;color:#777;margin-top:6px}.notice-title,.message-sender{font-weight:bold;color:#0b5d4d}.message-body{white-space:pre-wrap;line-height:1.5;margin-top:8px}.compose{border:1px solid #d9e3df;border-radius:10px;padding:16px;margin-top:18px;background:#fafcfb}.compose h3{margin:0 0 12px;color:#0b5d4d}.compose textarea,.compose select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:7px;font:inherit;margin:6px 0 12px}.account-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #eee}.account-row:last-child{border-bottom:0}.label{font-weight:bold;color:#666}.account-value{text-align:right}.account-actions{margin-top:18px}.account-actions button,button{padding:12px;border:0;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:15px}.logout{width:100%;margin-top:22px;background:#777!important}.addon-panel{border:1px solid #d9e3df;border-radius:9px;padding:14px;margin-top:12px;background:#fafcfb}.addon-panel h4{margin:0 0 7px;color:#0b5d4d}.addon-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px}.addon-modal{width:min(520px,100%);background:#fff;border-radius:12px;padding:20px;box-sizing:border-box;max-height:90vh;overflow:auto}.addon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.addon-grid input{width:100%;box-sizing:border-box;margin-top:5px;height:40px;padding:8px}.addon-cancel{background:#777!important}@media(max-width:600px){.container{margin:12px;padding:18px}.booking-summary{flex-direction:column}.addon-grid{grid-template-columns:1fr}.account-row{flex-direction:column;gap:5px}.account-value{text-align:left}}
</style>
</head>
<body>
<div class="container">
<h1>Guest Account</h1>
<p class="subtitle">CA Smart Staycation</p>
<div class="guest-nav-actions"><a class="make-booking" href="../index.html">Make New Booking</a></div>
<nav class="tabs" aria-label="Guest account navigation">
<button type="button" class="tab-button active" data-tab="bookings">Bookings</button>
<button type="button" class="tab-button" data-tab="notifications">Notifications <span id="notificationBadge" class="badge" hidden>0</span></button>
<button type="button" class="tab-button" data-tab="messages">Messages <span id="messageBadge" class="badge" hidden>0</span></button>
<button type="button" class="tab-button" data-tab="account">Account Settings</button>
</nav>
<section id="bookingsPanel" class="panel active"><div id="bookingsList"><div class="empty">Loading bookings...</div></div></section>
<section id="notificationsPanel" class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Notifications</h2><button type="button" id="markReadNotifications">Mark all as read</button></div><div id="notificationsList"><div class="empty">Loading notifications...</div></div></section>
<section id="messagesPanel" class="panel"><h2>Messages</h2><div id="messagesList"><div class="empty">Loading messages...</div></div><div class="compose"><h3>Send a message to CA Smart Staycation</h3><label for="messageBooking">Booking (optional)</label><select id="messageBooking"><option value="">General message</option></select><label for="messageText">Message</label><textarea id="messageText" rows="5" maxlength="3000" placeholder="Type your message..."></textarea><button type="button" id="sendMessage">Send Message</button><div id="messageStatus" class="meta"></div></div></section>
<section id="accountPanel" class="panel"><h2>Account Settings</h2><div class="account-card" style="padding:18px"><div class="account-row"><span class="label">Email address</span><span id="accountEmail" class="account-value">—</span></div><div class="account-row"><span class="label">Booking reference</span><span id="accountReference" class="account-value">—</span></div><div class="account-row"><span class="label">Password</span><span class="account-value">••••••••</span></div><div class="account-actions"><button type="button" id="changePassword">Change Password</button></div></div></section>
<button id="logout" class="logout">Logout</button>
</div>
<script>
const API="https://ca-smart-staycation-muqd.onrender.com/api",TOKEN=localStorage.getItem("guestAuthToken");
const auth=()=>({Authorization:`Bearer ${TOKEN}`});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const dateText=v=>{if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"})};
let account=null,bookings=[];
if(!TOKEN) location.href="guest-login.html";
document.querySelectorAll(".tab-button").forEach(btn=>btn.addEventListener("click",()=>openTab(btn.dataset.tab)));
function openTab(name){document.querySelectorAll(".tab-button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));document.getElementById(name+"Panel").classList.add("active");if(name!=="bookings")loadInbox();}
async function loadAccount(){try{const r=await fetch(`${API}/guest-auth/me`,{headers:auth(),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||"Session expired.");account=d.account||{};bookings=d.bookings||[];renderBookings(bookings);document.getElementById("accountEmail").textContent=account.email||"—";document.getElementById("accountReference").textContent=account.bookingReference||"—";fillBookingSelect();}catch(e){document.getElementById("bookingsList").innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}
function renderBookings(items){const el=document.getElementById("bookingsList");if(!items.length){el.innerHTML='<div class="empty">No bookings found.</div>';return}el.innerHTML=items.map(b=>{const active=["Waiting for Payment","Reserved","Pending Payment Verification","Payment Rejected"].includes(b.bookingStatus)&&new Date(b.checkIn).getTime()>Date.now();const canUpload=["Waiting for Payment","Payment Rejected"].includes(b.bookingStatus);return `<div class="booking-card" data-id="${esc(b._id)}"><div class="booking-summary"><div><div class="reference">${esc(b.bookingReference||"N/A")}</div><div>${esc(b.bookingType||"Booking")} · ${dateText(b.checkIn)} → ${dateText(b.checkOut)}</div><div class="meta">Status: ${esc(b.bookingStatus||"—")}</div></div><strong>₱${Number(b.totalAmount||0).toLocaleString()}</strong></div><div class="details"><p><strong>Guests:</strong> ${Number(b.adults||0)} adult(s), ${Number(b.children||0)} child(ren)</p><p><strong>Payment:</strong> ${esc(b.paymentStatus||"Pending")}</p>${b.bookingStatus==="Waiting for Payment"?'<p class="meta">Payment proof is required before this booking can be confirmed.</p>':b.bookingStatus==="Payment Rejected"?'<p class="meta">Your previous payment proof was rejected. Please upload a new proof of payment.</p>':""}${canUpload?`<div class="booking-actions"><button class="upload-payment" onclick="uploadPayment('${esc(b._id)}')">${b.bookingStatus === "Payment Rejected" ? "Re-upload Payment Proof" : "Upload Payment Proof"}</button></div>`:""}${active?`<div class="addon-panel"><h4>Booking Actions</h4><div class="booking-actions"><button class="danger" onclick="cancelBooking('${esc(b._id)}',this)">Cancel Booking</button></div><h4>Additional Guest & Amenities</h4><p>You may request additional guests or a complete additional set of towel, toiletries, bedsheet and blanket during your stay.</p><p><strong>₱300 per additional guest</strong> and <strong>₱300 per complete additional set</strong>. Payment proof is required.</p><button class="addon-btn" onclick="openAddon('${esc(b._id)}')">Request Additional Guest / Amenities</button></div>`:""}</div><div class="booking-actions"><button class="secondary" onclick="const c=this.closest('.booking-card');c.classList.toggle('open');this.textContent=c.classList.contains('open')?'Hide Details':'View Details'">View Details</button></div></div>`}).join("")}
async function cancelBooking(id,button){if(!confirm("Are you sure you want to cancel this booking?"))return;button.disabled=true;button.textContent="Cancelling...";try{const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(id)}/cancel`,{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({reason:"Guest requested cancellation"})}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to cancel this booking.");alert(d.message||"Booking cancelled successfully.");await loadAccount();}catch(e){alert(e.message);button.disabled=false;button.textContent="Cancel Booking"}}
async function uploadPayment(id){const booking=bookings.find(x=>String(x._id)===String(id));if(!booking){alert("Booking information not found. Please refresh the page and try again.");return}localStorage.setItem("guestBooking",JSON.stringify(booking));location.href="payment.html"}
function fillBookingSelect(){const s=document.getElementById("messageBooking");s.innerHTML='<option value="">General message</option>'+bookings.map(b=>`<option value="${esc(b._id)}">${esc(b.bookingReference||b._id)} — ${dateText(b.checkIn)} to ${dateText(b.checkOut)}</option>`).join("")}
async function loadInbox(){try{const r=await fetch(`${API}/guest/inbox`,{headers:auth(),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to load inbox.");renderNotifications(d.notifications||[]);renderMessages(d.messages||[]);const unreadN=(d.notifications||[]).filter(x=>!x.read).length,unreadM=(d.messages||[]).filter(x=>x.senderType==="admin"&&!x.readByGuest).length;setBadge("notificationBadge",unreadN);setBadge("messageBadge",unreadM);}catch(e){document.getElementById("notificationsList").innerHTML=`<div class="empty">${esc(e.message)}</div>`;document.getElementById("messagesList").innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}
function setBadge(id,count){const el=document.getElementById(id);el.hidden=!count;el.textContent=count}
function renderNotifications(items){const el=document.getElementById("notificationsList");if(!items.length){el.innerHTML='<div class="empty">No notifications yet.</div>';return}el.innerHTML=items.map(n=>`<div class="notice-card ${n.read?"":"unread"}"><div class="notice-title">${esc(n.title||"Notification")}</div><div style="margin-top:7px;line-height:1.5">${esc(n.message||"")}</div><div class="meta">${n.createdAt?new Date(n.createdAt).toLocaleString("en-PH"):""}</div></div>`).join("")}
function renderMessages(items){const el=document.getElementById("messagesList");if(!items.length){el.innerHTML='<div class="empty">No messages yet. You can send a message below.</div>';return}el.innerHTML=items.map(m=>`<div class="message-card ${m.senderType==="admin"&&!m.readByGuest?"unread":""}"><div class="message-sender">${esc(m.senderName|| (m.senderType==="admin"?"CA Smart Staycation Admin":"You"))}</div><div class="message-body">${esc(m.message||"")}</div>${m.booking?`<div class="meta">Booking: ${esc(m.booking.bookingReference||m.booking)}</div>`:""}<div class="meta">${m.createdAt?new Date(m.createdAt).toLocaleString("en-PH"):""}</div></div>`).join("")}
document.getElementById("markReadNotifications").onclick=async()=>{try{await fetch(`${API}/guest/inbox/read`,{method:"PUT",headers:auth()});await loadInbox()}catch(e){alert("Unable to update notifications.")}};
document.getElementById("sendMessage").onclick=async()=>{const text=document.getElementById("messageText").value.trim(),bookingId=document.getElementById("messageBooking").value,status=document.getElementById("messageStatus"),button=document.getElementById("sendMessage");if(!text){status.textContent="Please enter a message.";return}button.disabled=true;status.textContent="Sending...";try{const r=await fetch(`${API}/guest/messages`,{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({message:text,bookingId})}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to send message.");document.getElementById("messageText").value="";status.textContent="Message sent.";await loadInbox()}catch(e){status.textContent=e.message}finally{button.disabled=false}};
document.getElementById("changePassword").onclick=()=>location.href="change-password.html";
document.getElementById("logout").onclick=()=>{localStorage.removeItem("guestAuthToken");localStorage.removeItem("guestAccount");localStorage.removeItem("guestBooking");location.href="guest-login.html"};
async function openAddon(id){const d=await(await fetch(`${API}/guest-auth/me`,{headers:auth(),cache:"no-store"})).json(),b=(d.bookings||[]).find(x=>x._id===id);if(!b)return;const max=Math.max(0,4-Number(b.adults||0)),back=document.createElement("div");back.className="addon-modal-backdrop";back.innerHTML=`<div class="addon-modal"><h3>Request Additional Guest / Amenities</h3><p>Each additional adult guest costs <strong>₱300</strong>. Each complete additional set of towel + toiletries + bedsheet + blanket is also <strong>₱300</strong>.</p><div class="addon-grid"><label>Additional adult guests (max ${max})<input id="ag" type="number" min="0" max="${max}" value="0"></label><label>Additional complete sets<input id="as" type="number" min="0" value="0"></label></div><p><strong>Amount to pay: ₱<span id="aa">0</span></strong></p><label><strong>Upload payment proof *</strong><input id="ap" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><button class="addon-cancel" onclick="this.closest('.addon-modal-backdrop').remove()">Cancel</button><button id="submitAddon">Submit Request & Payment Proof</button></div>`;document.body.appendChild(back);const update=()=>back.querySelector("#aa").textContent=((Number(back.querySelector("#ag").value)||0)+(Number(back.querySelector("#as").value)||0))*300;back.querySelector("#ag").oninput=update;back.querySelector("#as").oninput=update;back.querySelector("#submitAddon").onclick=async()=>{const g=Math.min(max,Math.max(0,Number(back.querySelector("#ag").value)||0)),s=Math.max(0,Number(back.querySelector("#as").value)||0),file=back.querySelector("#ap").files[0],amount=(g+s)*300;if(!amount)return alert("Select at least one additional guest or complete set.");if(!file)return alert("Payment proof is required.");const fd=new FormData();fd.append("extraGuests",g);fd.append("amenitySets",s);fd.append("paymentProof",file);const btn=back.querySelector("#submitAddon");btn.disabled=true;btn.textContent="Submitting...";try{const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(id)}/add-ons`,{method:"POST",headers:auth(),body:fd}),x=await r.json();if(!r.ok)throw Error(x.message||"Unable to submit request.");alert(x.message||"Request submitted.");back.remove();loadAccount()}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Submit Request & Payment Proof"}}}
loadAccount();
</script>
</body>
</html>
