<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:950px;margin:40px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center;margin:0}.subtitle,.updated{text-align:center;color:#666}.updated{font-size:13px;margin-bottom:20px}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar button{width:auto;margin:0}.badge{display:inline-block;min-width:18px;padding:2px 6px;border-radius:999px;background:#b42318;color:#fff;font-size:11px}.inbox{display:none;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:20px;background:#fafcfb}.inbox.open{display:block}.section-title{font-size:18px;font-weight:bold;color:#0b5d4d;margin:22px 0 12px;border-bottom:1px solid #ddd;padding-bottom:8px}.notification,.message{border:1px solid #e1e6e3;border-radius:8px;padding:11px 13px;margin:8px 0;line-height:1.5}.notification{background:#fff8e8;border-left:4px solid #c9a44c}.notification.unread{font-weight:600}.message.guest{margin-left:15%;background:#e9f3ee}.message.admin{margin-right:15%;background:#eef2f5}.message small{display:block;color:#78827e;font-size:11px;margin-bottom:5px}.attachment{display:inline-block;margin:6px 5px 0 0;padding:6px 9px;border:1px solid #ccd5d1;border-radius:6px;background:#fff;color:#0b5d4d;text-decoration:none;font-size:12px}.compose textarea{width:100%;min-height:80px;box-sizing:border-box;padding:10px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;resize:vertical}.compose input{margin-top:9px}.booking-tools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:18px 0 12px}.booking-tools input,.booking-tools select{width:100%;box-sizing:border-box;height:42px;padding:9px 11px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;background:#fff}.booking-count{font-size:13px;color:#68736e;margin-bottom:10px}.booking-card{border:1px solid #ddd;border-radius:10px;margin:10px 0;background:#fff;overflow:hidden}.booking-summary{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 17px}.summary-main{min-width:0}.reference{font-size:18px;font-weight:bold;color:#c9a44c}.summary-meta{font-size:13px;color:#68736e;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary-right{text-align:right;white-space:nowrap}.summary-right strong{display:block;font-size:16px}.status-pill{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:999px;background:#fff8e8;border:1px solid #ead8a9;font-size:11px;font-weight:bold}.details{display:none;padding:0 17px 17px;border-top:1px solid #edf0ee}.booking-card.open .details{display:block}.details .row{display:flex;justify-content:space-between;gap:20px;margin:9px 0}.label{font-weight:bold}.note{background:#f7faf9;padding:15px;border-left:5px solid #0b5d4d;line-height:1.6;margin-top:14px}.refund{margin-top:10px;padding:10px;background:#fff8e8;border-left:4px solid #c9a44c}.refund.done{background:#e9f3ee;border-left-color:#0b5d4d}.booking-actions{display:flex;gap:8px;margin:12px 17px 17px}.booking-actions button{flex:1}button{width:100%;margin-top:10px;padding:12px;border:0;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:15px}.secondary{background:#c9a44c}.danger{background:#b42318}.logout{background:#777}.empty{text-align:center;padding:25px;color:#666}.error{text-align:center;color:#b42318;padding:20px}.hidden{display:none!important}@media(max-width:600px){.container{margin:15px;padding:18px}.toolbar,.booking-tools{display:flex;flex-direction:column}.toolbar button,.booking-tools input,.booking-tools select{width:100%}.booking-summary{align-items:flex-start}.summary-right{text-align:right}.booking-actions{flex-direction:column;margin:10px 17px 17px}.details .row{gap:10px}}.tab-button.active{background:#c9a44c}.tab-panel{display:block}.tab-panel.hidden-tab{display:none!important}</style></head><body><div class="container"><h1>My Bookings</h1><p class="subtitle">CA Smart Staycation Guest Account</p><div id="updated" class="updated">Checking latest status...</div><div class="toolbar"><button id="bookingsBtn" class="tab-button active">Bookings</button><button id="notificationBtn" class="tab-button">Notifications <span id="notificationBadge" class="badge" hidden>0</span></button><button id="inboxBtn" class="tab-button">Message Inbox <span id="messageBadge" class="badge" hidden>0</span></button><button id="newBookingBtn" class="tab-button">Make Another Booking</button></div><section id="inbox" class="inbox"><div class="section-title">Notifications</div><div id="notificationsList"></div><div class="section-title">Messages</div><div id="messagesList"></div><div class="compose"><textarea id="messageText" placeholder="Send a message to CA Smart Staycation admin..."></textarea><input id="messageFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"><button id="sendMessage">Send Message</button></div></section><section id="bookingsPanel" class="tab-panel"><div class="section-title">Reservations</div><div class="booking-tools"><input id="bookingSearch" type="search" placeholder="Search booking reference..."><select id="bookingFilter"><option value="all">All Bookings</option><option value="active">Active</option><option value="pending">Pending Payment</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option><option value="completed">Completed</option></select></div><div id="bookingCount" class="booking-count"></div><div id="bookingsList"><div class="empty">Loading bookings...</div></div><button id="loadMore" class="secondary hidden">Load More Bookings</button><div class="note">All bookings made using your registered email address are shown here.</div></section><button class="logout" id="logout">Logout</button></div><script>
const API="https://ca-smart-staycation-muqd.onrender.com/api",tokenKey="guestAuthToken";let loading=false,inbox={messages:[],notifications:[]},allBookings=[],visibleCount=10;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const auth=()=>({Authorization:`Bearer ${localStorage.getItem(tokenKey)}`});const dateText=v=>{if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"})};const shortDate=v=>{if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"})};const statusText=s=>({"Pending Payment Verification":"Payment Verification Pending","Payment Rejected":"Payment Proof Rejected",Reserved:"Confirmed",Confirmed:"Confirmed","Checked In":"Checked In","Checked Out":"Completed",Cancelled:"Cancelled",Expired:"Expired"}[s]||s||"Pending");
const cancellable=b=>["Reserved","Pending Payment Verification","Payment Rejected","Confirmed"].includes(b.bookingStatus)&&new Date(b.checkIn).getTime()>Date.now();
const canUploadPaymentProof=b=>Number(b.totalAmount||0)>0&&b.paymentStatus!=="Paid"&&!['Cancelled','Expired','Checked Out','Checked In','Confirmed'].includes(b.bookingStatus);
function filterBookings(){const q=document.getElementById("bookingSearch").value.trim().toLowerCase(),f=document.getElementById("bookingFilter").value;return allBookings.filter(b=>{const text=`${b.bookingReference||""} ${b.bookingStatus||""} ${b.bookingType||""}`.toLowerCase();if(q&&!text.includes(q))return false;if(f==="active")return cancellable(b);if(f==="pending")return ["Pending Payment Verification","Payment Rejected"].includes(b.bookingStatus);if(f==="confirmed")return ["Reserved","Confirmed"].includes(b.bookingStatus);if(f==="cancelled")return ["Cancelled","Expired"].includes(b.bookingStatus);if(f==="completed")return b.bookingStatus==="Checked Out";return true})}
function policy(b){const total=Math.max(0,Number(b.totalAmount||0)),paid=b.paymentProofSubmittedAt||b.paymentDate||b.createdAt,h=(Date.now()-new Date(paid).getTime())/3600000,d=(new Date(b.checkIn).getTime()-Date.now())/86400000;if(h<=1)return{fee:Math.min(500,total),refund:Math.max(0,total-500),rule:"Within 1 hour after payment proof submission"};if(d>=3)return{fee:Math.min(1000,total),refund:Math.max(0,total-1000),rule:"3 days or more before check-in"};if(d>=0)return{fee:Math.round(total*.5),refund:Math.round(total*.5),rule:"2 days before check-in through check-in date"};return{fee:total,refund:0,rule:"Past check-in"}}
async function cancelBooking(b,btn){if(!cancellable(b))return;const paid=b.paymentStatus==="Paid"||Boolean(b.paymentProof),p=paid?policy(b):{fee:0,refund:0,rule:"No payment recorded"};if(!confirm(`Cancel ${b.bookingReference}?\n\n${paid?`Rule: ${p.rule}\nInconvenience fee: ₱${p.fee.toLocaleString()}\nEstimated refund: ₱${p.refund.toLocaleString()}`:"No payment recorded; no refund is required."}\n\nContinue?`))return;btn.disabled=true;btn.textContent="Cancelling...";try{const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(b._id)}/cancel`,{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({reason:"Guest requested cancellation"})}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to cancel booking.");alert(d.message);await load();await loadInbox()}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Cancel Booking"}}
function openPaymentProof(b){localStorage.setItem("guestBooking",JSON.stringify(b));location.href="payment.html"}
function renderBookings(){const el=document.getElementById("bookingsList"),filtered=filterBookings(),slice=filtered.slice(0,visibleCount);el.innerHTML="";document.getElementById("bookingCount").textContent=`Showing ${slice.length} of ${filtered.length} booking${filtered.length===1?"":"s"}`;document.getElementById("loadMore").classList.toggle("hidden",slice.length>=filtered.length);if(!filtered.length){el.innerHTML='<div class="empty">No bookings match your search or filter.</div>';return}slice.forEach(b=>{const card=document.createElement("div");card.className="booking-card";let msg="Your booking status is shown above.";if(b.bookingStatus==="Pending Payment Verification")msg="Your payment proof has been received. Please wait for admin verification.";if(b.bookingStatus==="Payment Rejected")msg="Your payment proof was rejected. Please submit a new proof.";if(b.bookingStatus==="Reserved"||b.bookingStatus==="Confirmed")msg="Your payment has been verified and your reservation is confirmed.";if(b.bookingStatus==="Cancelled")msg=b.refundStatus==="Refunded"?"Your booking was cancelled and the refund has been processed.":"Your booking was cancelled. Your refund request is being processed by the administrator.";card.innerHTML=`<div class="booking-summary"><div class="summary-main"><div class="reference">${esc(b.bookingReference||"N/A")}</div><div class="summary-meta">${esc(b.bookingType||"Booking")} · ${shortDate(b.checkIn)} → ${shortDate(b.checkOut)}</div></div><div class="summary-right"><strong>₱${Number(b.totalAmount||0).toLocaleString()}</strong><span class="status-pill">${esc(statusText(b.bookingStatus))}</span></div></div><div class="details"><div class="row"><span class="label">Check-in</span><span>${dateText(b.checkIn)}</span></div><div class="row"><span class="label">Check-out</span><span>${dateText(b.checkOut)}</span></div><div class="row"><span class="label">Guests</span><span>${Number(b.adults||0)} adult(s), ${Number(b.children||0)} child(ren)</span></div><div class="row"><span class="label">Payment</span><span>${esc(b.paymentStatus||"Pending")}</span></div><div class="row"><span class="label">Total Amount</span><strong>₱${Number(b.totalAmount||0).toLocaleString()}</strong></div><div class="note">${esc(msg)}</div></div>`;const actions=document.createElement("div");actions.className="booking-actions";const view=document.createElement("button");view.textContent="View Details";view.className="secondary";view.onclick=()=>{card.classList.toggle("open");view.textContent=card.classList.contains("open")?"Hide Details":"View Details"};actions.appendChild(view);if(canUploadPaymentProof(b)){const p=document.createElement("button");p.className="secondary";p.textContent=b.bookingStatus==="Payment Rejected"?"Re-upload Payment Proof":"Upload Proof of Payment";p.title="Upload or replace your payment proof";p.onclick=()=>openPaymentProof(b);actions.appendChild(p)}if(cancellable(b)){const x=document.createElement("button");x.className="danger";x.textContent="Cancel Booking";x.title="Cancel this booking and request a refund according to the cancellation policy";x.onclick=()=>cancelBooking(b,x);actions.appendChild(x)}if(["Requested","Processing","Refunded"].includes(b.refundStatus)){const x=document.createElement("div");x.className=`refund ${b.refundStatus==="Refunded"?"done":""}`;x.textContent=b.refundStatus==="Refunded"?`Refund processed: ₱${Number(b.refundAmount||0).toLocaleString()}.`:`Refund requested: ₱${Number(b.refundAmount||0).toLocaleString()}. Waiting for administrator processing.`;card.querySelector(".details").appendChild(x)}el.appendChild(card);card.appendChild(actions)})}
function renderInbox(){const un=inbox.notifications.filter(n=>!n.read).length,um=inbox.messages.filter(m=>!m.readByGuest).length,nb=document.getElementById("notificationBadge"),mb=document.getElementById("messageBadge");nb.textContent=un;nb.hidden=!un;mb.textContent=um;mb.hidden=!um;document.getElementById("notificationsList").innerHTML=inbox.notifications.map(n=>`<div class="notification ${n.read?"":"unread"}"><strong>${esc(n.title)}</strong><div>${esc(n.message)}</div><small>${dateText(n.createdAt)}</small></div>`).join("")||'<div class="empty">No notifications.</div>';document.getElementById("messagesList").innerHTML=inbox.messages.map(m=>`<div class="message ${m.senderType}"><small>${esc(m.senderName||m.senderType)} · ${dateText(m.createdAt)}</small>${esc(m.message)} ${(m.attachments||[]).map(a=>`<a class="attachment" target="_blank" rel="noopener" href="${a.data}">${esc(a.name)}</a>`).join("")}</div>`).join("")||'<div class="empty">No messages yet.</div>'}
async function loadInbox(){try{const r=await fetch(`${API}/guest/inbox`,{headers:auth(),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message);inbox=d;renderInbox()}catch(e){console.error(e)}}async function sendMessage(){const text=document.getElementById("messageText").value.trim(),files=[...document.getElementById("messageFiles").files];if(!text&&!files.length)return alert("Enter a message or attach a file.");if(files.length>3)return alert("You can attach up to 3 files.");try{const attachments=await Promise.all(files.map(f=>new Promise((ok,no)=>{if(f.size>5*1024*1024)return no(Error(`${f.name} is larger than 5 MB.`));const rd=new FileReader();rd.onload=()=>ok({name:f.name,type:f.type,data:rd.result});rd.onerror=()=>no(Error("Unable to read attachment."));rd.readAsDataURL(f)})));const r=await fetch(`${API}/guest/messages`,{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({message:text,attachments})}),d=await r.json();if(!r.ok)throw Error(d.message);document.getElementById("messageText").value="";document.getElementById("messageFiles").value="";await loadInbox()}catch(e){alert(e.message||"Unable to send message.")}}async function markRead(){try{await fetch(`${API}/guest/inbox/read`,{method:"PUT",headers:auth()});await loadInbox()}catch(e){console.error(e)}}async function load(){const t=localStorage.getItem(tokenKey);if(!t){location.href="guest-login.html";return}if(loading)return;loading=true;try{const r=await fetch(`${API}/guest-auth/me`,{headers:auth(),cache:"no-store"}),d=await r.json();if(!r.ok){localStorage.removeItem(tokenKey);location.href="guest-login.html";return}if(d.account?.mustChangePassword){location.replace("change-password.html");return}allBookings=(d.bookings||[]).sort((a,b)=>new Date(b.createdAt||b.checkIn)-new Date(a.createdAt||a.checkIn));visibleCount=Math.min(10,allBookings.length);renderBookings();document.getElementById("updated").textContent="Last updated: "+new Date().toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit",second:"2-digit"})}catch(e){document.getElementById("bookingsList").innerHTML='<div class="error">Unable to load your bookings.</div>'}finally{loading=false}}
document.getElementById("bookingSearch").addEventListener("input",()=>{visibleCount=10;renderBookings()});document.getElementById("bookingFilter").addEventListener("change",()=>{visibleCount=10;renderBookings()});document.getElementById("loadMore").onclick=()=>{visibleCount+=10;renderBookings()};document.getElementById("notificationBtn").onclick=async()=>{document.getElementById("inbox").classList.add("open");await loadInbox();await markRead()};document.getElementById("inboxBtn").onclick=async()=>{document.getElementById("inbox").classList.add("open");await loadInbox();await markRead()};document.getElementById("newBookingBtn").onclick=()=>{location.href="../index.html"};document.getElementById("sendMessage").onclick=sendMessage;document.getElementById("logout").onclick=()=>{localStorage.removeItem(tokenKey);localStorage.removeItem("guestAccount");localStorage.removeItem("guestBooking");location.href="guest-login.html"};load();loadInbox();setInterval(()=>{load();loadInbox()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden){load();loadInbox()}});
function showGuestTab(tab){const bookings=document.getElementById("bookingsPanel"),inbox=document.getElementById("inbox"),bb=document.getElementById("bookingsBtn"),nb=document.getElementById("notificationBtn"),mb=document.getElementById("inboxBtn"),newBtn=document.getElementById("newBookingBtn");if(!bookings||!inbox)return;const bookingActive=tab==="bookings";bookings.classList.toggle("hidden-tab",!bookingActive);inbox.classList.toggle("open",!bookingActive);[bb,nb,mb,newBtn].forEach(b=>b&&b.classList.remove("active"));if(bookingActive)bb&&bb.classList.add("active");else if(tab==="notifications")nb&&nb.classList.add("active");else if(tab==="messages")mb&&mb.classList.add("active");}
document.addEventListener("DOMContentLoaded",()=>{const bb=document.getElementById("bookingsBtn"),nb=document.getElementById("notificationBtn"),mb=document.getElementById("inboxBtn"),newBtn=document.getElementById("newBookingBtn");bb&&bb.addEventListener("click",()=>showGuestTab("bookings"));nb&&nb.addEventListener("click",()=>showGuestTab("notifications"));mb&&mb.addEventListener("click",()=>showGuestTab("messages"));newBtn&&newBtn.addEventListener("click",()=>{location.href="../index.html"});showGuestTab("bookings");});
</script></body></html>
