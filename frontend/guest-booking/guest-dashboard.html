<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333}.container{max-width:950px;margin:40px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{color:#0b5d4d;text-align:center}.booking-card{border:1px solid #ddd;border-radius:10px;margin:10px 0;background:#fff;overflow:hidden}.booking-summary{display:flex;justify-content:space-between;padding:15px 17px}.reference{font-size:18px;font-weight:bold;color:#c9a44c}.details{display:none;padding:0 17px 17px;border-top:1px solid #edf0ee}.booking-card.open .details{display:block}.booking-actions{display:flex;gap:8px;margin:12px 17px 17px}.booking-actions button{flex:1}.secondary{background:#c9a44c!important}.addon-btn{background:#0b5d4d!important}.empty{text-align:center;padding:25px;color:#666}button{width:100%;margin-top:10px;padding:12px;border:0;background:#0b5d4d;color:#fff;border-radius:8px;cursor:pointer;font-size:15px}.addon-panel{border:1px solid #d9e3df;border-radius:9px;padding:14px;margin-top:12px;background:#fafcfb}.addon-panel h4{margin:0 0 7px;color:#0b5d4d}.addon-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px}.addon-modal{width:min(520px,100%);background:#fff;border-radius:12px;padding:20px;box-sizing:border-box;max-height:90vh;overflow:auto}.addon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.addon-grid input{width:100%;box-sizing:border-box;margin-top:5px;height:40px;padding:8px}.addon-cancel{background:#777}@media(max-width:600px){.container{margin:15px;padding:18px}.booking-actions{flex-direction:column}.addon-grid{grid-template-columns:1fr}}</style></head><body><div class="container"><h1>My Bookings</h1><p style="text-align:center;color:#666">CA Smart Staycation Guest Account</p><div id="bookingsList"><div class="empty">Loading bookings...</div></div><button id="logout" style="background:#777">Logout</button></div><script>const API="https://ca-smart-staycation-muqd.onrender.com/api",TOKEN=localStorage.getItem("guestAuthToken");const auth=()=>({Authorization:`Bearer ${TOKEN}`});const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function dateText(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"})}async function load(){if(!TOKEN){location.href="guest-login.html";return}try{const r=await fetch(`${API}/guest-auth/me`,{headers:auth(),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||"Session expired.");render(d.bookings||[])}catch(e){document.getElementById('bookingsList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function render(bookings){const el=document.getElementById('bookingsList');if(!bookings.length){el.innerHTML='<div class="empty">No bookings found.</div>';return}el.innerHTML=bookings.map(b=>{const active=["Reserved","Confirmed","Checked In"].includes(b.bookingStatus);return `<div class="booking-card" data-id="${esc(b._id)}"><div class="booking-summary"><div><div class="reference">${esc(b.bookingReference||'N/A')}</div><div>${esc(b.bookingType||'Booking')} · ${dateText(b.checkIn)} → ${dateText(b.checkOut)}</div></div><strong>₱${Number(b.totalAmount||0).toLocaleString()}</strong></div><div class="details"><p><strong>Guests:</strong> ${Number(b.adults||0)} adult(s), ${Number(b.children||0)} child(ren)</p><p><strong>Payment:</strong> ${esc(b.paymentStatus||'Pending')}</p>${active?`<div class="addon-panel"><h4>Additional Guest & Amenities</h4><p>You may request additional guests or a complete additional set of towel, toiletries, bedsheet and blanket anytime during your stay.</p><p><strong>₱300 per additional guest</strong> and <strong>₱300 per complete additional set</strong>. Payment proof is required immediately and every request is subject to admin verification.</p><button class="addon-btn" onclick="openAddon('${esc(b._id)}')">Request Additional Guest / Amenities</button></div>`:''}</div><div class="booking-actions"><button class="secondary" onclick="const c=this.closest('.booking-card');c.classList.toggle('open');this.textContent=c.classList.contains('open')?'Hide Details':'View Details'">View Details</button></div></div>`}).join('')}async function openAddon(id){const d=await(await fetch(`${API}/guest-auth/me`,{headers:auth(),cache:'no-store'})).json(),b=(d.bookings||[]).find(x=>x._id===id);if(!b)return;const max=Math.max(0,4-Number(b.adults||0)),back=document.createElement('div');back.className='addon-modal-backdrop';back.innerHTML=`<div class="addon-modal"><h3>Request Additional Guest / Amenities</h3><p>Each additional adult guest costs <strong>₱300</strong>. Each complete additional set of towel + toiletries + bedsheet + blanket is also <strong>₱300</strong>.</p><div class="addon-grid"><label>Additional adult guests (max ${max})<input id="ag" type="number" min="0" max="${max}" value="0"></label><label>Additional complete sets<input id="as" type="number" min="0" value="0"></label></div><p><strong>Amount to pay: ₱<span id="aa">0</span></strong></p><label><strong>Upload payment proof *</strong><input id="ap" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><button class="addon-cancel" onclick="this.closest('.addon-modal-backdrop').remove()">Cancel</button><button id="submitAddon">Submit Request & Payment Proof</button></div>`;document.body.appendChild(back);const update=()=>back.querySelector('#aa').textContent=((Number(back.querySelector('#ag').value)||0)+(Number(back.querySelector('#as').value)||0))*300;back.querySelector('#ag').oninput=update;back.querySelector('#as').oninput=update;back.querySelector('#submitAddon').onclick=async()=>{const g=Math.min(max,Math.max(0,Number(back.querySelector('#ag').value)||0)),s=Math.max(0,Number(back.querySelector('#as').value)||0),file=back.querySelector('#ap').files[0],amount=(g+s)*300;if(!amount)return alert('Select at least one additional guest or complete set.');if(!file)return alert('Payment proof is required.');const fd=new FormData();fd.append('extraGuests',g);fd.append('amenitySets',s);fd.append('paymentProof',file);const btn=back.querySelector('#submitAddon');btn.disabled=true;btn.textContent='Submitting...';try{const r=await fetch(`${API}/guest-auth/bookings/${encodeURIComponent(id)}/add-ons`,{method:'POST',headers:auth(),body:fd}),x=await r.json();if(!r.ok)throw Error(x.message||'Unable to submit request.');alert(x.message||'Request submitted.');back.remove();load()}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Submit Request & Payment Proof'}}}document.getElementById('logout').onclick=()=>{localStorage.removeItem('guestAuthToken');localStorage.removeItem('guestAccount');location.href='guest-login.html'};load();</script></body></html>
