<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | CA Smart Staycation</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="booking-container"><div class="form-card">
<h2>Reset Password</h2><p>Create a new password for your guest account.</p>
<form id="resetForm">
<div class="form-group"><label>New Password</label><input type="password" id="newPassword" minlength="8" autocomplete="new-password" required></div>
<div class="form-group"><label>Confirm New Password</label><input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required></div>
<button type="submit" class="continue-button" id="resetButton">Reset Password</button>
</form><p id="message" style="margin-top:16px;line-height:1.5;"></p>
<div style="text-align:center;margin-top:18px;"><a href="guest-login.html" style="color:#0b5d4d;font-weight:600;text-decoration:none;">Back to Guest Login</a></div>
</div></div>
<script src="js/reset-password.js"></script>
</body>
</html>
