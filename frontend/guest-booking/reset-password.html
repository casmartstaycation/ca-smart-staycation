<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password | CA Smart Staycation</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="booking-container"><div class="form-card">
<h2>Reset Password</h2><p>Create a new password for your guest account.</p>
<form id="resetForm">
<div class="form-group"><label>New Password</label><input type="password" id="newPassword" minlength="8" autocomplete="new-password" required></div>
<div class="form-group"><label>Confirm New Password</label><input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required></div>
<button type="submit" class="continue-button" id="resetButton">Reset Password</button>
</form><p id="message" style="margin-top:16px;line-height:1.5;"></p>
<div style="text-align:center;margin-top:18px;"><a href="guest-login.html" style="color:#0b5d4d;font-weight:600;text-decoration:none;">Back to Guest Login</a></div>
</div></div>
<script>
const API = window.CA_SMART_API || '/api';
const token=new URLSearchParams(location.search).get("token");
document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("message"),btn=document.getElementById("resetButton");if(!token){msg.textContent="This reset link is invalid or missing.";msg.style.color="#b42318";return;}btn.disabled=true;btn.textContent="Resetting...";try{const r=await fetch(`${API}/guest-auth/reset-password`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,newPassword:document.getElementById("newPassword").value,confirmPassword:document.getElementById("confirmPassword").value})});const d=await r.json();msg.textContent=d.message||"Password reset complete.";msg.style.color=r.ok?"#0b5d4d":"#b42318";if(r.ok){document.getElementById("resetForm").reset();setTimeout(()=>location.href="guest-login.html",1500);}}catch(err){msg.textContent="Unable to connect to the server. Please try again.";msg.style.color="#b42318";}finally{btn.disabled=false;btn.textContent="Reset Password";}});
</script></body></html>
