<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | CA Smart Staycation</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center}.container{width:min(92%,460px);background:#fff;padding:32px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.12)}h1{text-align:center;color:#0b5d4d;margin:0 0 8px}.subtitle{text-align:center;color:#666;line-height:1.5;margin:0 0 25px}.warning{background:#fff8e8;border-left:5px solid #c9a44c;padding:14px;line-height:1.5;margin-bottom:22px;border-radius:6px}label{display:block;font-weight:bold;margin:15px 0 7px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccc;border-radius:7px;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#0b5d4d;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.error{color:#b42318;margin-top:15px;line-height:1.4}.success{color:#0b5d4d;margin-top:15px;line-height:1.4}
</style>
</head>
<body>
<div class="container">
<h1>Change Your Password</h1>
<p class="subtitle">CA Smart Staycation Guest Account</p>
<div class="warning" id="warningBox">For your security, you must change the temporary password sent with your booking before you can access your account.</div>
<form id="changePasswordForm">
<label for="currentPassword">Current Password</label>
<input id="currentPassword" type="password" autocomplete="current-password" required>
<label for="newPassword">New Password</label>
<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">Confirm New Password</label>
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
<button id="changeButton" type="submit">Change Password</button>
<div id="message"></div>
</form>
</div>
<script src="../js/offline-api.js?v=20260820-8"></script>
<script>
const GITHUB_ONLY=window.location.hostname.endsWith("github.io");
const API="/api";
const token=localStorage.getItem("guestAuthToken");
const form=document.getElementById("changePasswordForm");
const button=document.getElementById("changeButton");
const message=document.getElementById("message");

if(GITHUB_ONLY){
 document.querySelectorAll("#changePasswordForm input,#changePasswordForm button").forEach(el=>el.disabled=true);
 document.getElementById("warningBox").innerHTML="<strong>Temporary GitHub-only mode.</strong> Password changes are paused while the live guest database is offline. No request will be sent to Vercel.";
 message.className="error";
 message.textContent="Guest account services are temporarily unavailable.";
}else if(!token){
 location.href="guest-login.html";
}

form.addEventListener("submit",async e=>{
 e.preventDefault();
 if(GITHUB_ONLY)return;
 const currentPassword=document.getElementById("currentPassword").value;
 const newPassword=document.getElementById("newPassword").value;
 const confirmPassword=document.getElementById("confirmPassword").value;
 message.className=""; message.textContent="";
 if(newPassword.length<8){message.className="error";message.textContent="New password must be at least 8 characters.";return;}
 if(newPassword!==confirmPassword){message.className="error";message.textContent="New passwords do not match.";return;}
 button.disabled=true;button.textContent="Changing Password...";
 try{
  const response=await fetch(`${API}/guest-auth/change-password`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({currentPassword,newPassword,confirmPassword})});
  const raw=await response.text();
  let result={};
  try{result=raw?JSON.parse(raw):{};}catch(_){throw new Error(`Server returned an invalid response (HTTP ${response.status}).`);}
  if(!response.ok){message.className="error";message.textContent=result.message||"Unable to change password.";button.disabled=false;button.textContent="Change Password";return;}
  localStorage.setItem("guestAccount",JSON.stringify(result.account||{}));
  message.className="success";message.textContent="Password changed successfully. Redirecting...";
  setTimeout(()=>location.href="guest-dashboard.html",700);
 }catch(err){console.error(err);message.className="error";message.textContent=err?.message||"Unable to connect to the server.";button.disabled=false;button.textContent="Change Password";}
});
</script>
</body>
</html>
