<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | CA Smart Staycation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<h1>Change Your Password</h1>
<p class="subtitle">CA Smart Staycation Guest Account</p>
<div class="warning">For your security, you must change the temporary password sent with your booking before you can access your account.</div>
<form id="changePasswordForm">
<label for="currentPassword">Current Password</label>
<input id="currentPassword" type="password" autocomplete="current-password" required>
<label for="newPassword">New Password</label>
<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">Confirm New Password</label>
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
<button id="changeButton" type="submit">Change Password</button>
<div id="message"></div>
</form>
</div>
<script src="js/change-password.js"></script>
</body>
</html>
