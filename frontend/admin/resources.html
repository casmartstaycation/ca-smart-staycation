<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Smart Staycation — Units & Parking</title>
<link rel="stylesheet" href="resources.css">
</head>
<body>
<div class="page">
<header class="topbar">
  <div><p class="eyebrow">CA SMART STAYCATION</p><h1>Units & Parking</h1><p class="subtitle">Manage accommodation and parking records used by the booking system.</p></div>
  <div class="top-actions"><a href="bookings.html">Dashboard</a><button id="refreshBtn">Refresh</button></div>
</header>
<main class="grid">
<section class="card">
 <div class="card-head"><div><h2>Accommodation Units</h2><p>Update name, rate, capacity and availability.</p></div><button id="addRoomBtn">Add Unit</button></div>
 <div id="rooms" class="list"><div class="muted">Loading…</div></div>
</section>
<section class="card">
 <div class="card-head"><div><h2>Parking Slots</h2><p>Manage slot names, rates and availability.</p></div><button id="addParkingBtn">Add Slot</button></div>
 <div id="parking" class="list"><div class="muted">Loading…</div></div>
</section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Edit</h2><button id="closeModal">×</button></div><form id="resourceForm"></form></div></div>
</div>
<script src="resources.js"></script>
</body>
</html>
