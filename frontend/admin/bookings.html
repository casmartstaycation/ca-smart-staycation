<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA Smart Staycation — Bookings</title>
<link rel="stylesheet" href="bookings.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <p class="eyebrow">CA SMART STAYCATION</p>
      <h1>Booking Management</h1>
      <p class="subtitle">Review reservations, payments, check-ins and check-outs.</p>
    </div>
    <button class="refresh" id="refreshBtn">Refresh</button>
  </header>

  <section class="stats" aria-label="Booking summary">
    <div class="stat"><span>Total</span><strong id="totalCount">0</strong></div>
    <div class="stat"><span>Reserved</span><strong id="reservedCount">0</strong></div>
    <div class="stat"><span>Pending Payment</span><strong id="pendingCount">0</strong></div>
    <div class="stat"><span>Checked In</span><strong id="checkedInCount">0</strong></div>
  </section>

  <section class="toolbar">
    <input id="searchInput" type="search" placeholder="Search reference or guest">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option>Reserved</option>
      <option>Pending Payment Verification</option>
      <option>Checked In</option>
      <option>Checked Out</option>
      <option>Cancelled</option>
    </select>
    <select id="paymentFilter">
      <option value="">All payments</option>
      <option>Paid</option>
      <option>Pending</option>
    </select>
  </section>

  <div class="table-wrap">
    <table id="bookingTable">
      <thead>
        <tr>
          <th>Reference</th>
          <th>Guest</th>
          <th>Stay</th>
          <th>Accommodation</th>
          <th>Parking</th>
          <th>Total</th>
          <th>Payment</th>
          <th>Status</th>
          <th>Proof</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="emptyState" class="empty" hidden>No bookings match the current filters.</div>
  </div>
</div>
<script src="bookings.js"></script>
</body>
</html>
