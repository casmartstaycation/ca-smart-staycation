<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Messages | CA Smart Staycation</title><link rel="stylesheet" href="../css/mobile-responsive.css?v=20260815-4"><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#24342f}.wrap{max-width:1100px;margin:30px auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;box-sizing:border-box;padding:0 14px;border:1px solid #d7e1dc;border-radius:7px;text-decoration:none;background:#eef3f0;color:#173f35;font-weight:700}.nav a:hover{background:#e1ebe6}.nav a.active{background:#173f35;color:#fff;border-color:#173f35}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}h1{margin-top:0;color:#173f35}.message{padding:12px;border:1px solid #e2e8e5;border-radius:8px;margin:8px 0;background:#f7faf8}.message.guest{border-left:4px solid #b08a3c}.message small{display:block;color:#77817d;margin-bottom:6px}.attachment{display:inline-flex;align-items:center;gap:7px;margin:8px 6px 0 0;color:#173f35;text-decoration:none;font-weight:700}.attachment img{display:block;width:180px;height:130px;object-fit:cover;border:1px solid #d7e1dc;border-radius:7px;background:#fff}.attachment.image-file{display:inline-block;vertical-align:top}.attachment.image-file .attachment-name{display:block;margin-top:5px;font-size:11px;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment.file-link{padding:8px 10px;border:1px solid #d7e1dc;border-radius:7px;background:#fff}.compose select,.compose input,.compose textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;margin-bottom:9px}.compose textarea{min-height:100px}.btn{border:0;border-radius:7px;background:#173f35;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.muted{color:#6f7975}.error{color:#a33a35}@media(max-width:800px){.wrap{margin:16px auto;padding:12px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.nav a{width:100%;padding:9px 6px;text-align:center;font-size:12px;min-width:0}.grid{grid-template-columns:1fr}.card{padding:14px}.compose select,.compose input,.compose textarea,.compose .btn{width:100%;max-width:100%}.message{overflow-wrap:anywhere;word-break:break-word}.attachment img{width:min(100%,280px);height:auto;max-height:220px}.attachment{max-width:100%;overflow-wrap:anywhere}.compose textarea{min-height:110px}}@media(max-width:360px){.nav{grid-template-columns:1fr}.wrap{padding:8px}}</style><script src="admin-api-routing.js?v=20260820-3"></script></head><body><div class="wrap"><nav class="nav" aria-label="Admin navigation"><a href="bookings.html">Bookings</a><a href="notifications.html">Notifications</a><a href="messages.html" class="active">Messages</a><a href="resources.html">Units & Parking Management</a><a href="bookings.html#voucherManagement">Voucher Management</a><a href="bookings.html#adminEmailSettings">Admin Account Settings</a></nav><div class="grid"><section class="card"><h1>Guest Messages</h1><div id="list"><p class="muted">Loading...</p></div></section><section class="card compose"><h2>Message a Guest</h2><select id="booking"><option value="">Loading bookings...</option></select><input id="email" readonly placeholder="Guest email"><textarea id="text" placeholder="Type your message..."></textarea><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"><small class="muted">Up to 3 files · 5 MB each · JPG, PNG, WEBP or PDF</small><button class="btn" id="send">Send Message</button><p id="status" class="muted"></p></section></div></div><script>const API="/api",token=()=>sessionStorage.getItem("caSmartAdminToken")||"",headers=()=>({Authorization:`Bearer ${token()}`});let bookings=[];function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function attachmentUrl(a){const value=typeof a?.data==='string'?a.data:(typeof a?.url==='string'?a.url:'');if(!value)return'';if(value.startsWith('data:')||value.startsWith('https://')||value.startsWith('http://')||value.startsWith('/'))return value;return''}function isImageAttachment(a){const type=String(a?.type||'').toLowerCase(),name=String(a?.name||'').toLowerCase();return type.startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp|svg)$/i.test(name)}function renderAttachment(a){const url=attachmentUrl(a),name=esc(a?.name||'Attachment');if(!url)return'';if(isImageAttachment(a)){return `<a class="attachment image-file" href="${esc(url)}" target="_blank" rel="noopener" title="Open ${name}"><img src="${esc(url)}" alt="${name}" loading="lazy" referrerpolicy="no-referrer"><span class="attachment-name">${name}</span></a>`}return `<a class="attachment file-link" href="${esc(url)}" target="_blank" rel="noopener">📎 ${name}</a>`}async function load(){if(window.CASmartAdminAuth?.githubOnly){location.href="bookings.html";return}if(!token()){location.href="bookings.html";return}try{const [ir,br]=await Promise.all([fetch(`${API}/admin/inbox`,{headers:headers(),cache:"no-store"}),fetch(`${API}/bookings`,{cache:"no-store"})]);const d=await ir.json(),bd=await br.json();if(!ir.ok)throw Error(d.message||"Unable to load messages.");bookings=bd.data||[];document.getElementById("list").innerHTML=(d.messages||[]).map(m=>`<div class="message ${esc(m.senderType||"")}"><small><strong>${esc(m.senderName||m.guestEmail||"Guest")}</strong> · ${esc(m.guestEmail||"")} · ${new Date(m.createdAt).toLocaleString("en-PH")}</small><div>${esc(m.message)}</div><div class="attachments">${(m.attachments||[]).map(renderAttachment).join(" ")}</div></div>`).join("")||'<p class="muted">No messages yet.</p>';const sel=document.getElementById("booking"),old=sel.value;sel.innerHTML=bookings.map(b=>`<option value="${esc(b._id)}">${esc(b.bookingReference||"Booking")} — ${esc(`${b.firstName||""} ${b.lastName||""}`)} — ${esc(b.email||"")}</option>`).join("");if(old&&bookings.some(b=>String(b._id)===old))sel.value=old;updateEmail()}catch(e){document.getElementById("list").innerHTML=`<p class="error">${esc(e.message)}</p>`}}function updateEmail(){const b=bookings.find(x=>String(x._id)===String(document.getElementById("booking").value));document.getElementById("email").value=b?.email||""}async function files(){const fs=[...document.getElementById("files").files];if(fs.length>3)throw Error("You can attach up to 3 files.");return Promise.all(fs.map(f=>{if(f.size>5*1024*1024)throw Error(`${f.name} is larger than 5 MB.`);return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({name:f.name,type:f.type,size:f.size,data:r.result});r.onerror=()=>no(Error(`Unable to read ${f.name}.`));r.readAsDataURL(f)})}))}document.getElementById("booking").onchange=updateEmail;document.getElementById("send").onclick=async()=>{if(window.CASmartAdminAuth?.githubOnly){location.href="bookings.html";return}const b=bookings.find(x=>String(x._id)===String(document.getElementById("booking").value)),status=document.getElementById("status"),text=document.getElementById("text").value.trim();if(!b||(!text&&!document.getElementById("files").files.length)){status.textContent="Select a guest and enter a message or attach a file.";return}status.textContent="Sending...";try{const attachments=await files(),r=await fetch(`${API}/admin/messages`,{method:"POST",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify({guestEmail:b.email,bookingId:b._id,message:text,attachments})}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to send message.");document.getElementById("text").value="";document.getElementById("files").value="";status.textContent="Message sent.";load()}catch(e){status.textContent=e.message}};load();if(!window.CASmartAdminAuth?.githubOnly)setInterval(load,30000);</script></body></html>
