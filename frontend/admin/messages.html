<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Messages | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#24342f}.wrap{max-width:1100px;margin:30px auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{padding:10px 14px;border-radius:7px;text-decoration:none;background:#e8eeeb;color:#173f35;font-weight:700}.nav a.active{background:#173f35;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}h1{margin-top:0;color:#173f35}.message{padding:12px;border:1px solid #e2e8e5;border-radius:8px;margin:8px 0;background:#f7faf8}.message.guest{border-left:4px solid #b08a3c}.message small{display:block;color:#77817d;margin-bottom:6px}.attachment{display:inline-block;margin:7px 5px 0 0;color:#173f35}.compose select,.compose input,.compose textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d5ddd9;border-radius:7px;font:inherit;margin-bottom:9px}.compose textarea{min-height:100px}.btn{border:0;border-radius:7px;background:#173f35;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.muted{color:#6f7975}.error{color:#a33a35}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav class="nav"><a href="bookings.html">Bookings</a><a href="notifications.html">Notifications</a><a href="messages.html" class="active">Messages</a><a href="resources.html">Units & Parking</a></nav><div class="grid"><section class="card"><h1>Guest Messages</h1><div id="list"><p class="muted">Loading...</p></div></section><section class="card compose"><h2>Message a Guest</h2><select id="booking"><option value="">Loading bookings...</option></select><input id="email" readonly placeholder="Guest email"><textarea id="text" placeholder="Type your message..."></textarea><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"><small class="muted">Up to 3 files · 5 MB each · JPG, PNG, WEBP or PDF</small><button class="btn" id="send">Send Message</button><p id="status" class="muted"></p></section></div></div><script>const API="https://ca-smart-staycation-muqd.onrender.com/api",token=()=>sessionStorage.getItem("caSmartAdminToken")||"",headers=()=>({Authorization:`Bearer ${token()}`});let bookings=[];function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){if(!token()){location.href="bookings.html";return}try{const [ir,br]=await Promise.all([fetch(`${API}/admin/inbox`,{headers:headers(),cache:"no-store"}),fetch(`${API}/bookings`,{cache:"no-store`})]);const d=await ir.json(),bd=await br.json();if(!ir.ok)throw Error(d.message||"Unable to load messages.");bookings=bd.data||[];document.getElementById("list").innerHTML=(d.messages||[]).map(m=>`<div class="message ${m.senderType||""}"><small><strong>${esc(m.senderName||m.guestEmail||"Guest")}</strong> · ${esc(m.guestEmail||"")} · ${new Date(m.createdAt).toLocaleString("en-PH")}</small><div>${esc(m.message)}</div>${(m.attachments||[]).map(a=>`<a class="attachment" target="_blank" rel="noopener" href="${a.data}">${esc(a.name)}</a>`).join(" ")}</div>`).join("")||'<p class="muted">No messages yet.</p>';const sel=document.getElementById("booking");const old=sel.value;sel.innerHTML=bookings.map(b=>`<option value="${esc(b._id)}">${esc(b.bookingReference||"Booking")} — ${esc(`${b.firstName||""} ${b.lastName||""}`)} — ${esc(b.email||"")}</option>`).join("");if(old&&bookings.some(b=>String(b._id)===old))sel.value=old;updateEmail()}catch(e){document.getElementById("list").innerHTML=`<p class="error">${esc(e.message)}</p>`}}function updateEmail(){const b=bookings.find(x=>String(x._id)===String(document.getElementById("booking").value));document.getElementById("email").value=b?.email||""}async function files(){const fs=[...document.getElementById("files").files];if(fs.length>3)throw Error("You can attach up to 3 files.");return Promise.all(fs.map(f=>{if(f.size>5*1024*1024)throw Error(`${f.name} is larger than 5 MB.`);return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({name:f.name,type:f.type,size:f.size,data:r.result});r.onerror=()=>no(Error(`Unable to read ${f.name}.`));r.readAsDataURL(f)})}))}document.getElementById("booking").onchange=updateEmail;document.getElementById("send").onclick=async()=>{const b=bookings.find(x=>String(x._id)===String(document.getElementById("booking").value)),status=document.getElementById("status"),text=document.getElementById("text").value.trim();if(!b||(!text&&!document.getElementById("files").files.length)){status.textContent="Select a guest and enter a message or attach a file.";return}status.textContent="Sending...";try{const attachments=await files(),r=await fetch(`${API}/admin/messages`,{method:"POST",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify({guestEmail:b.email,bookingId:b._id,message:text,attachments})}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to send message.");document.getElementById("text").value="";document.getElementById("files").value="";status.textContent="Message sent.";load()}catch(e){status.textContent=e.message}};load();setInterval(load,30000);</script></body></html>
