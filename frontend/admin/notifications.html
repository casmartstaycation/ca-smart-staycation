<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Notifications | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#24342f}.wrap{max-width:1000px;margin:30px auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{padding:10px 14px;border-radius:7px;text-decoration:none;background:#e8eeeb;color:#173f35;font-weight:700}.nav a.active{background:#173f35;color:#fff}.card{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}h1{margin-top:0;color:#173f35}.notification{padding:13px;border:1px solid #e2e8e5;border-radius:8px;margin:9px 0;background:#fff8e8;border-left:4px solid #b08a3c}.notification small{display:block;color:#77817d;margin-top:6px}.muted{color:#6f7975}.error{color:#a33a35}.btn{border:0;border-radius:7px;background:#173f35;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><nav class="nav"><a href="bookings.html">Bookings</a><a href="notifications.html" class="active">Notifications</a><a href="messages.html">Messages</a><a href="resources.html">Units & Parking</a></nav><section class="card"><h1>Notifications</h1><p class="muted">Booking cancellations, payment updates and other guest notifications.</p><button class="btn" id="read">Mark All Read</button><div id="list"><p class="muted">Loading...</p></div></section></div><script>const API="https://ca-smart-staycation-muqd.onrender.com/api",token=()=>sessionStorage.getItem("caSmartAdminToken")||"",headers=()=>({Authorization:`Bearer ${token()}`});async function load(){if(!token()){location.href="bookings.html";return}try{const r=await fetch(`${API}/admin/inbox`,{headers:headers(),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to load notifications.");const list=(d.notifications||[]);document.getElementById("list").innerHTML=list.map(n=>`<div class="notification"><strong>${esc(n.title)}</strong><div>${esc(n.message)}</div><small>${new Date(n.createdAt).toLocaleString("en-PH")}${n.read?"":" · NEW"}</small></div>`).join("")||'<p class="muted">No notifications.</p>'}catch(e){document.getElementById("list").innerHTML=`<p class="error">${esc(e.message)}</p>`}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}document.getElementById("read").onclick=async()=>{await fetch(`${API}/admin/inbox/read`,{method:"PUT",headers:headers()});load()};load();setInterval(load,30000);</script></body></html>
