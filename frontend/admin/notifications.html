<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Notifications | CA Smart Staycation</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#24342f}.wrap{max-width:1000px;margin:30px auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;box-sizing:border-box;padding:0 14px;border:1px solid #d7e1dc;border-radius:7px;text-decoration:none;background:#eef3f0;color:#173f35;font-weight:700}.nav a:hover{background:#e1ebe6}.nav a.active{background:#173f35;color:#fff;border-color:#173f35}.card{background:#fff;border:1px solid #dfe6e2;border-radius:10px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}h1{margin-top:0;color:#173f35}.notification{padding:13px;border:1px solid #e2e8e5;border-radius:8px;margin:9px 0;background:#fff8e8;border-left:4px solid #b08a3c}.notification.unread{background:#fff4d6;border-left-color:#b42318;box-shadow:0 2px 8px rgba(180,35,24,.08)}.notification small{display:block;color:#77817d;margin-top:6px}.muted{color:#6f7975}.error{color:#a33a35}.btn{border:0;border-radius:7px;background:#173f35;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.badge{display:inline-block;margin-left:6px;min-width:18px;padding:2px 6px;border-radius:999px;background:#b42318;color:#fff;font-size:11px;text-align:center;line-height:1.2}</style></head><body><div class="wrap"><nav class="nav" aria-label="Admin navigation"><a href="bookings.html">Bookings</a><a href="notifications.html" class="active">Notifications <span id="unreadBadge" class="badge" hidden>0</span></a><a href="messages.html">Messages</a><a href="resources.html">Units & Parking Management</a><a href="bookings.html#voucherManagement">Voucher Management</a><a href="bookings.html#adminEmailSettings">Admin Email Notifications</a></nav><section class="card"><h1>Notifications</h1><p class="muted">Booking cancellations, refund requests, payment updates and other guest notifications.</p><button class="btn" id="read">Mark All Read</button><div id="list"><p class="muted">Loading...</p></div></section></div><script>const API="https://ca-smart-staycation-muqd.onrender.com/api",token=()=>sessionStorage.getItem("caSmartAdminToken")||"",headers=()=>({Authorization:`Bearer ${token()}`});async function load(){if(!token()){location.href="bookings.html";return}try{const r=await fetch(`${API}/admin/inbox`,{headers:headers(),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||"Unable to load notifications.");const list=d.notifications||[],unread=list.filter(n=>!n.read).length+(d.messages||[]).filter(m=>!m.readByAdmin).length,badge=document.getElementById("unreadBadge");badge.textContent=unread>99?"99+":unread;badge.hidden=!unread;document.getElementById("list").innerHTML=list.map(n=>`<div class="notification ${n.read?"":"unread"}"><strong>${esc(n.title)}</strong><div>${esc(n.message)}</div><small>${new Date(n.createdAt).toLocaleString("en-PH")}${n.read?"":" · NEW"}</small></div>`).join("")||'<p class="muted">No notifications.</p>'}catch(e){document.getElementById("list").innerHTML=`<p class="error">${esc(e.message)}</p>`}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}document.getElementById("read").onclick=async()=>{await fetch(`${API}/admin/inbox/read`,{method:"PUT",headers:headers()});load()};load();setInterval(load,15000);</script></body></html>
