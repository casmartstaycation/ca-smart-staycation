name: Restore Make New Booking button
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore guest booking button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/guest-booking/guest-dashboard.html')
          s = p.read_text()
          marker = '<p class="subtitle">CA Smart Staycation</p>'
          button = '''<div class="guest-nav-actions"><a class="make-booking" href="../index.html">Make New Booking</a></div>'''
          if 'class="make-booking"' not in s:
              css_marker = '.tabs{display:flex;'
              css = '.guest-nav-actions{display:flex;justify-content:center;margin:0 0 18px}.make-booking{display:inline-block;text-decoration:none;background:#c9a44c;color:#fff;border-radius:8px;padding:12px 22px;font-weight:bold;text-align:center}.make-booking:hover{opacity:.9}.tabs{display:flex;'
              if css_marker in s:
                  s = s.replace(css_marker, css_marker.replace('.tabs{display:flex;', css), 1)
              else:
                  s = s.replace('</style>', css + '</style>', 1)
              s = s.replace(marker, marker + '\n' + button, 1)
              p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/guest-booking/guest-dashboard.html
          git diff --cached --quiet || git commit -m "Restore Make New Booking button"
          git push
      - name: Remove repair workflow
        if: always()
        run: |
          rm -f .github/workflows/restore-make-new-booking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/restore-make-new-booking.yml
          git diff --cached --quiet || git commit -m "Remove temporary booking button repair workflow"
          git push || true
