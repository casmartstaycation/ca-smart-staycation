name: Restore Guest Payment Upload

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-payment-upload.yml'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore upload action outside date condition
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/guest-booking/guest-dashboard.html')
          s = p.read_text(encoding='utf-8')

          old = '${canUpload?`<button class="upload-payment" onclick="uploadPayment(\'${esc(b._id)}\')">Upload Payment Proof</button>`:""}<button class="danger" onclick="cancelBooking(\'${esc(b._id)}\',this)">Cancel Booking</button>'
          new = '<button class="danger" onclick="cancelBooking(\'${esc(b._id)}\',this)">Cancel Booking</button>'
          if old not in s:
              raise SystemExit('Expected booking action block was not found; refusing to overwrite the dashboard.')
          s = s.replace(old, new, 1)

          marker = '${active?`<div class="addon-panel"><h4>Booking Actions</h4><div class="booking-actions">'
          replacement = '${canUpload?`<div class="booking-actions"><button class="upload-payment" onclick="uploadPayment(\'${esc(b._id)}\')">${b.bookingStatus === "Payment Rejected" ? "Re-upload Payment Proof" : "Upload Payment Proof"}</button></div>`:""}${active?`<div class="addon-panel"><h4>Booking Actions</h4><div class="booking-actions">'
          if marker not in s:
              raise SystemExit('Expected active booking marker was not found; refusing to overwrite the dashboard.')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit dashboard fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/guest-booking/guest-dashboard.html
          git diff --cached --quiet && echo 'No changes needed.' && exit 0
          git commit -m 'Restore guest payment proof re-upload button'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/restore-payment-upload.yml
          git commit -m 'Remove one-time payment upload repair workflow'
          git push
