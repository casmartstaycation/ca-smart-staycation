name: Fix guest cancellation visibility
on:
  push:
    paths:
      - '.github/workflows/fix-guest-cancellation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guest cancellation flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Backend: allow cancellation while waiting for payment proof.
          p = Path('backend/routes/guestAuthRoutes.js')
          s = p.read_text()
          s2 = s.replace('const ACTIVE_STATUSES = ["Reserved", "Pending Payment Verification", "Payment Rejected"];', 'const ACTIVE_STATUSES = ["Waiting for Payment", "Reserved", "Pending Payment Verification", "Payment Rejected"];')
          if s2 != s:
              p.write_text(s2)

          # Guest dashboard: show cancellation for Waiting for Payment and remove date-change UI.
          p = Path('frontend/guest-booking/guest-dashboard.html')
          s = p.read_text()
          s = s.replace('if(s==="Pending Payment Verification")return"Payment received — waiting for admin verification";', 'if(s==="Waiting for Payment")return"Waiting for Payment";if(s==="Pending Payment Verification")return"Payment received — waiting for admin verification";')
          s = s.replace('function active(b){return ["Reserved","Pending Payment Verification","Payment Rejected"].includes(b.bookingStatus)&&new Date(b.checkIn).getTime()>Date.now()}', 'function active(b){return ["Waiting for Payment","Reserved","Pending Payment Verification","Payment Rejected"].includes(b.bookingStatus)&&new Date(b.checkIn).getTime()>Date.now()}')
          s = s.replace('if(b.bookingStatus==="Pending Payment Verification")message="Your payment proof has been received. Please wait while our administrator verifies your payment.";', 'if(b.bookingStatus==="Waiting for Payment")message="Your booking is waiting for payment proof. Upload your payment proof from the payment page. You may cancel this booking before payment is verified.";if(b.bookingStatus==="Pending Payment Verification")message="Your payment proof has been received. Please wait while our administrator verifies your payment.";')
          # Remove the obsolete reschedule functions.
          s = re.sub(r'function uploadRescheduleProof\(.*?\nasync function rescheduleBooking\(', 'async function rescheduleBooking(', s, flags=re.S)
          s = re.sub(r'async function rescheduleBooking\(.*?\nfunction renderBooking\(', 'function renderBooking(', s, flags=re.S)
          # Replace the date-change/cancel action block with cancellation only.
          replacement = '''const cancelBtn=document.createElement("button");cancelBtn.className="danger";cancelBtn.textContent="Cancel Booking";cancelBtn.onclick=()=>cancelBooking(b,cancelBtn);actions.appendChild(cancelBtn)}'''
          s = re.sub(r'if\(active\(b\)\)\{const rescheduleBtn=.*?actions\.appendChild\(cancelBtn\)\}', replacement, s, flags=re.S)
          # Remove obsolete date-change CSS so the page no longer advertises that feature.
          s = re.sub(r'\.reschedule-box\{.*?\.fee-box input\{.*?\}', '', s, flags=re.S)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q 'Waiting for Payment' backend/routes/guestAuthRoutes.js
          grep -q 'function active(b){return ["Waiting for Payment"' frontend/guest-booking/guest-dashboard.html
          ! grep -q 'Change Booking Dates' frontend/guest-booking/guest-dashboard.html
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routes/guestAuthRoutes.js frontend/guest-booking/guest-dashboard.html .github/workflows/fix-guest-cancellation.yml
          git rm .github/workflows/fix-guest-cancellation.yml
          git diff --cached --quiet || git commit -m 'Fix guest cancellation and remove date change UI'
          git push