name: Remove date change feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-date-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove guest date-change feature
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/guest-booking/guest-dashboard.html')
          text = path.read_text(encoding='utf-8')

          # Remove all date-change/reschedule CSS, including the responsive rule.
          css_patterns = [
              r'\.reschedule-box(?:\.open)?\{.*?\}',
              r'\.reschedule-grid(?: label| input)?\{.*?\}',
              r'\.reschedule-actions(?: button)?\{.*?\}',
              r'\.fee-box(?: input)?\{.*?\}',
              r'@media\(max-width:600px\)\{\.reschedule-grid\{.*?\}\}',
          ]
          for pattern in css_patterns:
              text = re.sub(pattern, '', text)

          # Remove both reschedule functions and everything between them and renderBooking.
          text = re.sub(r'async function uploadRescheduleProof\(.*?(?=function renderBooking\()', '', text, flags=re.S)

          # Remove the guest Change Booking Dates UI while preserving Cancel Booking.
          text = re.sub(
              r'if\(active\(b\)\)\{const rescheduleBtn=.*?actions\.appendChild\(rescheduleBtn\);actions\.appendChild\(box\);const cancelBtn=',
              'if(active(b)){const cancelBtn=',
              text,
              flags=re.S
          )

          # Remove any remaining date-change status message.
          text = re.sub(r'if\(b\.reschedulePaymentStatus===.*?;', '', text)

          path.write_text(text, encoding='utf-8')

      - name: Verify date-change feature is absent
        shell: bash
        run: |
          ! grep -q "Change Booking Dates" frontend/guest-booking/guest-dashboard.html
          ! grep -q "rescheduleBooking" frontend/guest-booking/guest-dashboard.html
          ! grep -q "uploadRescheduleProof" frontend/guest-booking/guest-dashboard.html
          ! grep -q "reschedulePaymentProof" frontend/guest-booking/guest-dashboard.html
          ! grep -q "reschedule-box" frontend/guest-booking/guest-dashboard.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/guest-booking/guest-dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove guest booking date change feature"
          git push
