name: Parking calendar booked-mark verification

on:
  push:
    paths:
      - 'frontend/js/script.js'
      - 'frontend/js/parking-calendar-sync.js'
      - 'tests/parking-calendar.test.js'
  pull_request:
    paths:
      - 'frontend/js/script.js'
      - 'frontend/js/parking-calendar-sync.js'
      - 'tests/parking-calendar.test.js'
  workflow_dispatch:

jobs:
  test-parking-calendar:
    name: Verify parking booked-mark logic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure legacy broken script is quarantined
        run: |
          if [ -f "frontend/js/script.js.before-repair" ]; then
            echo "ERROR: frontend/js/script.js.before-repair must not exist (use .bak extension)."
            exit 1
          fi
          echo "OK: legacy script is quarantined."
      - name: Check parking logic signatures exist in script.js
        run: |
          # Ensure isDateBooked, bookingHasParking, bookingOverlapsDates are present
          for fn in "isDateBooked" "bookingHasParking" "bookingOverlapsDates"; do
            if ! grep -q "$fn" frontend/js/script.js; then
              echo "ERROR: $fn not found in frontend/js/script.js — test helpers may be out of sync."
              exit 1
            fi
          done
          # Ensure parking type check is still present
          if ! grep -q 'type==="parking"' frontend/js/script.js; then
            echo 'ERROR: parking type check (type==="parking") missing from isDateBooked in script.js'
            exit 1
          fi
          echo "OK: all required parking logic signatures present in script.js."
      - name: Run parking calendar unit tests
        run: node tests/parking-calendar.test.js
