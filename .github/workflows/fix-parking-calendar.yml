name: Fix parking calendar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch parking calendar logic
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/js/script.js")
          text = path.read_text(encoding="utf-8")

          start = text.index("function isDateBooked(date) {")
          end = text.index("/* =========================================\n   RENDER CALENDAR", start)

          replacement = r'''function isDateBooked(date) {

    const bookingType =
        document.getElementById("bookingType")?.value;

    const selectedRoom =
        document.getElementById("room")?.value || "";

    const target = new Date(date);
    target.setHours(0, 0, 0, 0);

    for (const booking of bookedDates) {

        if (
            booking.bookingStatus === "Cancelled" ||
            booking.bookingStatus === "Checked Out"
        ) {
            continue;
        }

        const checkIn = new Date(booking.checkIn);
        const checkOut = new Date(booking.checkOut);

        checkIn.setHours(0, 0, 0, 0);
        checkOut.setHours(0, 0, 0, 0);

        const overlaps =
            target >= checkIn &&
            target < checkOut;

        if (!overlaps) continue;

        const bookedRoom =
            booking.room?._id ||
            booking.room ||
            null;

        // IMPORTANT:
        // Do not compare MongoDB parking ObjectIds here.
        // ObjectIds can differ between databases. This property only needs
        // to answer whether the single parking resource is already reserved.
        const hasParkingBooking = Boolean(
            booking.parking?._id ||
            booking.parking
        );

        // ACCOMMODATION ONLY
        if (bookingType === "unit") {

            if (
                bookedRoom &&
                String(bookedRoom) === String(selectedRoom)
            ) {
                return true;
            }

        }

        // PARKING ONLY
        if (bookingType === "parking") {

            if (hasParkingBooking) {
                return true;
            }

        }

        // ACCOMMODATION + PARKING
        if (bookingType === "both") {

            if (
                bookedRoom &&
                String(bookedRoom) === String(selectedRoom)
            ) {
                return true;
            }

            if (hasParkingBooking) {
                return true;
            }

        }

    }

    return false;

}

'''

          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-parking-calendar.yml
          git add frontend/js/script.js .github/workflows/fix-parking-calendar.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: make parking calendar independent of MongoDB parking IDs"
          git push origin main
