name: Repair dynamic parking booking integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'chore: repair dynamic parking booking integration')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch frontend parking integration
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/js/script.js')
          text = path.read_text(encoding='utf-8')

          old_id = '6a68d96447b7608e22fe9f0f'
          if text.count(old_id) != 3:
              raise SystemExit(f'Expected exactly 3 hardcoded parking IDs, found {text.count(old_id)}')

          text = text.replace(
              'let rooms = [];\nlet bookedDates = [];',
              'let rooms = [];\nlet parkingSlots = [];\nlet selectedParkingId = null;\nlet bookedDates = [];',
              1
          )

          text = text.replace(
              '        await loadRooms();\n        await loadBookedDates();',
              '        await loadRooms();\n        await loadParkingSlots();\n        await loadBookedDates();',
              1
          )

          marker = '''/* =========================================\n   LOAD BOOKED DATES\n========================================= */'''
          parking_loader = '''/* =========================================\n   LOAD PARKING SLOTS\n========================================= */\n\nasync function loadParkingSlots() {\n\n    try {\n\n        const res = await fetch(`${API}/parking`);\n        const json = await res.json();\n\n        if (!res.ok) {\n            throw new Error(json.message || "Unable to load parking slots.");\n        }\n\n        parkingSlots = Array.isArray(json.data)\n            ? json.data\n            : [];\n\n        // Prefer the existing business slot by name/number, but always\n        // use its ID from the active database instead of hardcoding an ID.\n        const preferredParking = parkingSlots.find(slot =>\n            String(slot.parkingNumber || '').trim().toUpperCase() === 'SLOT 9' ||\n            String(slot.parkingName || '').trim().toUpperCase() === 'BAY 4'\n        );\n\n        const parking = preferredParking || parkingSlots[0] || null;\n\n        selectedParkingId = parking?._id || null;\n\n        console.log('PARKING SLOTS:', parkingSlots);\n        console.log('SELECTED PARKING:', parking);\n\n        if (!selectedParkingId) {\n            console.warn('No parking slot is available from /api/parking.');\n        }\n\n    } catch (err) {\n\n        parkingSlots = [];\n        selectedParkingId = null;\n\n        console.error('Failed to load parking slots:', err);\n\n    }\n\n}\n\n'''
          if marker not in text:
              raise SystemExit('LOAD BOOKED DATES marker not found')
          text = text.replace(marker, parking_loader + marker, 1)

          old_submit = '''// Accommodation + Parking\nif (bookingType === "both") {\n\n    parking = "6a68d96447b7608e22fe9f0f";\n\n}\n\n// Parking Only\nelse if (bookingType === "parking") {\n\n    parking = "6a68d96447b7608e22fe9f0f";\n\n}'''
          new_submit = '''// Accommodation + Parking / Parking Only\nif (bookingType === "both" || bookingType === "parking") {\n\n    // Use the parking ID loaded from the active database.\n    parking = selectedParkingId;\n\n    if (!parking) {\n        alert("Parking is currently unavailable. Please try again shortly.");\n        return;\n    }\n\n}'''
          if old_submit not in text:
              raise SystemExit('submit parking block not found')
          text = text.replace(old_submit, new_submit, 1)

          old_selected = '''const selectedParking =\n    "6a68d96447b7608e22fe9f0f";'''
          new_selected = '''const selectedParking = selectedParkingId;'''
          if old_selected not in text:
              raise SystemExit('calendar parking ID block not found')
          text = text.replace(old_selected, new_selected, 1)

          text = text.replace(
              '''if (bookingType === "parking") {\n\n        if (\n            bookedParking &&\n            String(bookedParking) === String(selectedParking)\n        ) {''',
              '''if (bookingType === "parking") {\n\n        if (\n            selectedParking &&\n            bookedParking &&\n            String(bookedParking) === String(selectedParking)\n        ) {''',
              1
          )

          text = text.replace(
              '''if (\n                bookedParking &&\n                String(bookedParking) === String(selectedParking)\n            ) {\n                return true;\n            }''',
              '''if (\n                selectedParking &&\n                bookedParking &&\n                String(bookedParking) === String(selectedParking)\n            ) {\n                return true;\n            }''',
              1
          )

          if old_id in text:
              raise SystemExit('Hardcoded parking ID still remains')

          if 'fetch(`${API}/parking`)' not in text:
              raise SystemExit('/api/parking loader was not added')

          if 'parking = selectedParkingId;' not in text:
              raise SystemExit('Dynamic parking ID is not used for submission')

          path.write_text(text, encoding='utf-8')

      - name: Commit repaired file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/js/script.js
          git diff --cached --check
          git diff --cached -- frontend/js/script.js
          git commit -m 'fix: load parking id dynamically from api'
          git push
