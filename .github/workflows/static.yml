# Deploy the CA Smart Staycation frontend to GitHub Pages
name: Deploy CA Smart Staycation Frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload latest frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy latest frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
