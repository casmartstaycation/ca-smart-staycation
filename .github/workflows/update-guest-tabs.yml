name: Update Guest Account Tabs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Bookings tab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/guest-booking/guest-dashboard.html')
          s = p.read_text()
          old_toolbar = '<div class="toolbar"><button id="notificationBtn">Notifications <span id="notificationBadge" class="badge" hidden>0</span></button><button id="inboxBtn">Message Inbox <span id="messageBadge" class="badge" hidden>0</span></button></div>'
          new_toolbar = '<div class="toolbar"><button id="bookingsBtn" class="tab-button active">Bookings</button><button id="notificationBtn" class="tab-button">Notifications <span id="notificationBadge" class="badge" hidden>0</span></button><button id="inboxBtn" class="tab-button">Message Inbox <span id="messageBadge" class="badge" hidden>0</span></button></div>'
          if old_toolbar in s and 'id="bookingsBtn"' not in s:
              s = s.replace(old_toolbar, new_toolbar, 1)
          style = '.tab-button.active{background:#c9a44c}.tab-panel{display:block}.tab-panel.hidden-tab{display:none!important}'
          if style not in s:
              s = s.replace('</style>', style + '</style>', 1)
          marker = '<div class="section-title">Reservations</div>'
          if marker in s and '<section id="bookingsPanel"' not in s:
              s = s.replace(marker, '<section id="bookingsPanel" class="tab-panel">' + marker, 1)
              note = '<div class="note">All bookings made using your registered email address are shown here.</div>'
              s = s.replace(note, note + '</section>', 1)
          tab_script = '''\nfunction showGuestTab(tab){const bookings=document.getElementById("bookingsPanel"),inbox=document.getElementById("inbox"),bb=document.getElementById("bookingsBtn"),nb=document.getElementById("notificationBtn"),mb=document.getElementById("inboxBtn");if(!bookings||!inbox)return;const bookingActive=tab==="bookings";bookings.classList.toggle("hidden-tab",!bookingActive);inbox.classList.toggle("open",!bookingActive);[bb,nb,mb].forEach(b=>b&&b.classList.remove("active"));if(bookingActive)bb&&bb.classList.add("active");else if(tab==="notifications")nb&&nb.classList.add("active");else mb&&mb.classList.add("active");}\ndocument.addEventListener("DOMContentLoaded",()=>{const bb=document.getElementById("bookingsBtn"),nb=document.getElementById("notificationBtn"),mb=document.getElementById("inboxBtn");bb&&bb.addEventListener("click",()=>showGuestTab("bookings"));nb&&nb.addEventListener("click",()=>showGuestTab("notifications"));mb&&mb.addEventListener("click",()=>showGuestTab("messages"));showGuestTab("bookings");});\n'''
          if 'function showGuestTab(tab)' not in s:
              s = s.replace('</script>', tab_script + '</script>', 1)
          p.write_text(s)
          PY
      - name: Commit changes and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/guest-booking/guest-dashboard.html
          git diff --cached --quiet || git commit -m "Add bookings tab to guest account"
          rm -f .github/workflows/update-guest-tabs.yml
          git add .github/workflows/update-guest-tabs.yml
          git commit -m "Remove temporary guest tab updater"
          git push
